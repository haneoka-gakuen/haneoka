name: Resource storage maintenance

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id
        required: true
        default: jp-cbt
        type: string
      apply:
        description: Delete unreferenced metadata and CAS objects
        required: true
        default: false
        type: boolean
      pipeline_stage_run_id:
        description: Exact workflow run id whose private R2 staging objects should be removed
        required: false
        type: string
  schedule:
    - cron: "16 8 * * 0"

concurrency:
  group: resource-pipeline-${{ inputs.server || 'jp-cbt' }}
  cancel-in-progress: false

jobs:
  maintain:
    name: Collect unreferenced objects
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: resource-${{ inputs.server || 'jp-cbt' }}
    permissions:
      contents: read
    env:
      RESOURCE_SERVER: ${{ inputs.server || 'jp-cbt' }}
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.apply == true }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      PIPELINE_STAGE_RUN_ID: ${{ inputs.pipeline_stage_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Remove selected resource-pipeline staging objects
        if: env.PIPELINE_STAGE_RUN_ID != ''
        run: |
          if [[ ! "$PIPELINE_STAGE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "pipeline_stage_run_id must contain only decimal digits" >&2
            exit 1
          fi
          aws s3 rm \
            "s3://hotdori-assets/private/resource-pipeline-stage/$PIPELINE_STAGE_RUN_ID/$RESOURCE_SERVER/" \
            --recursive \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto
      - name: Prune unreferenced manifests
        if: env.APPLY_CHANGES == 'true'
        run: |
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-releases --concurrency 64
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-sources --concurrency 64
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-uploads --concurrency 64
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-garupa-master \
            --garupa-server jp --retain 3 --concurrency 64
      - name: Collect unreferenced CAS objects
        run: |
          arguments=(gc-r2 --concurrency 64)
          if [[ "$APPLY_CHANGES" != "true" ]]; then
            arguments+=(--dry-run)
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" "${arguments[@]}"
