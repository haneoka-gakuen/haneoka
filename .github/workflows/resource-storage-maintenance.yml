name: Resource storage maintenance

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id
        required: true
        default: intl
        type: string
      apply:
        description: Delete the planned unreferenced metadata and CAS objects
        required: true
        default: false
        type: boolean
      pipeline_stage_run_id:
        description: Exact completed workflow run id whose private stages should be removed
        required: false
        type: string
      cas_shard:
        description: Optional two-digit lowercase SHA-256 prefix for a bounded CAS sweep
        required: false
        type: string
      metadata_only:
        description: Maintain release, source and stage metadata without scanning shared CAS
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "16 8 * * 0"

# Weekly retention remains automatic; manual apply=false is strictly read-only.
concurrency:
  group: resource-storage-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Maintain ${{ matrix.server }} resource metadata
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server: ${{ fromJSON(github.event_name == 'schedule' && '["intl","jp"]' || format('["{0}"]', inputs.server || 'intl')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: resource-build-server-${{ matrix.server }}
      cancel-in-progress: false
    environment:
      name: resource-${{ matrix.server }}
    permissions:
      contents: read
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      RESOURCE_SERVER: ${{ matrix.server }}
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.apply == true }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      PIPELINE_STAGE_RUN_ID: ${{ inputs.pipeline_stage_run_id }}
      CAS_SHARD: ${{ inputs.cas_shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Plan or apply server metadata and stage cleanup
        run: |
          mkdir -p "$RUNNER_TEMP/storage-maintenance"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/storage-maintenance/source-commit.txt"
          if [[ -n "$CAS_SHARD" && ! "$CAS_SHARD" =~ ^[0-9a-f]{2}$ ]]; then
            echo "cas_shard must be two lowercase hexadecimal characters" >&2
            exit 1
          fi
          common=(--concurrency 32)
          if [[ "$APPLY_CHANGES" != "true" ]]; then common+=(--dry-run); fi
          stage=(prune-stages "${common[@]}")
          if [[ -n "$PIPELINE_STAGE_RUN_ID" ]]; then stage+=(--run-id "$PIPELINE_STAGE_RUN_ID"); fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" "${stage[@]}" > "$RUNNER_TEMP/storage-maintenance/stages.json"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-uploads "${common[@]}" > "$RUNNER_TEMP/storage-maintenance/uploads.json"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-package-leases --concurrency 32 --dry-run > "$RUNNER_TEMP/storage-maintenance/package-leases.json"
      - name: Verify current release metadata before applying retention
        if: env.APPLY_CHANGES == 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" verify-remote
          --fast --concurrency 32
      - name: Plan or apply release and source retention
        run: |
          common=(--concurrency 32)
          if [[ "$APPLY_CHANGES" != "true" ]]; then common+=(--dry-run); fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-releases "${common[@]}" > "$RUNNER_TEMP/storage-maintenance/releases.json"
          source_args=()
          if [[ "$APPLY_CHANGES" != "true" ]]; then
            while IFS= read -r release; do source_args+=(--ignore-release "$release"); done < <(jq -r '.plannedReleases | keys[]' "$RUNNER_TEMP/storage-maintenance/releases.json")
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-sources "${common[@]}" "${source_args[@]}" > "$RUNNER_TEMP/storage-maintenance/sources.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-maintenance-${{ matrix.server }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-maintenance
          retention-days: 30
          if-no-files-found: warn

  collect:
    name: Plan or apply one shared CAS sweep
    needs: maintain
    if: ${{ github.event_name == 'schedule' || inputs.metadata_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: resource-${{ inputs.server || 'intl' }}
    permissions:
      contents: read
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      RESOURCE_SERVER: ${{ inputs.server || 'intl' }}
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.apply == true }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      CAS_SHARD: ${{ inputs.cas_shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Prune retained Garupa snapshots when applying
        if: env.APPLY_CHANGES == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/storage-maintenance"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prune-garupa-master \
            --garupa-server jp --retain 3 --concurrency 32 > "$RUNNER_TEMP/storage-maintenance/garupa-master.json"
      - name: Plan or apply the shared CAS sweep
        run: |
          mkdir -p "$RUNNER_TEMP/storage-maintenance"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/storage-maintenance/source-commit.txt"
          arguments=(gc-r2 --concurrency 32)
          if [[ "$APPLY_CHANGES" != "true" ]]; then arguments+=(--dry-run); fi
          if [[ -n "$CAS_SHARD" ]]; then arguments+=(--shard "$CAS_SHARD"); fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" "${arguments[@]}" > "$RUNNER_TEMP/storage-maintenance/cas-gc.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-maintenance-cas-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-maintenance
          retention-days: 30
          if-no-files-found: warn
