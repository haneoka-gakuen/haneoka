name: Resource pipeline

on:
  schedule:
    # 04:05, 12:05, 20:05 Asia/Tokyo (UTC+9) for current resource servers.
    - cron: "5 3 * * *"
    - cron: "5 11 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id ("all" runs all current servers)
        required: true
        default: intl
        type: choice
        options:
          - intl
          - intl-test
          - jp
          - jp-cbt
          - intl-cbt
          - all
      tgw_mode:
        description: Manual current TGW projection; normal keeps the resource build path
        required: false
        default: normal
        type: choice
        options:
          - normal
          - preflight
          - publish-reviewed
      tgw_input_json:
        description: Exact current identity and reviewed API raw-pointer SHA/length
        required: false
        type: string
      tgw_approval_json:
        description: Root-reviewed candidate hash and actual strong S3 ETag; publish mode only
        required: false
        type: string
      github_environment:
        description: GitHub Actions environment for the run
        required: false
        default: ""
        type: string
      package_r2_key:
        description: Private R2 CAS key of one APK, APKS, or XAPK file
        required: false
        type: string
      source_id:
        description: Existing immutable R2 source id to resume without ingestion
        required: false
        type: string
      ktx2:
        description: Package original runtime texture blocks
        required: false
        default: true
        type: boolean
      basis_reencode:
        description: Lossy runtime-only Basis opt-in; preserve canonical PNGs
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the source identity is unchanged
        required: false
        default: false
        type: boolean
      no_reuse:
        description: Disable cross-source and cross-build artifact reuse
        required: false
        default: false
        type: boolean
concurrency:
  group: resource-pipeline-${{ github.event_name == 'schedule' && 'production-daily' || inputs.server }}
  cancel-in-progress: false

jobs:
  pipeline_intl:
    name: Build and publish Intl resources
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.tgw_mode || inputs.tgw_mode == 'normal') && (inputs.server == 'intl' || inputs.server == 'all')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ github.event_name == 'schedule' && 'resource-intl' || inputs.github_environment || 'resource-intl' }}
      server: intl
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      # On schedule events the inputs context is empty, which would feed ''
      # into boolean-typed callee inputs and fail input validation.
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  pipeline_jp:
    name: Build and publish JP resources
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (!inputs.tgw_mode || inputs.tgw_mode == 'normal') && (inputs.server == 'jp' || inputs.server == 'all')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ github.event_name == 'schedule' && 'resource-jp' || inputs.github_environment || 'resource-jp' }}
      server: jp
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  pipeline_intl_test:
    name: Build and publish Intl test resources
    if: ${{ github.event_name == 'workflow_dispatch' && (!inputs.tgw_mode || inputs.tgw_mode == 'normal') && (inputs.server == 'intl-test' || inputs.server == 'all') }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ github.event_name == 'schedule' && 'resource-intl-test' || inputs.github_environment || 'resource-intl-test' }}
      server: intl-test
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      # On schedule events the inputs context is empty, which would feed ''
      # into boolean-typed callee inputs and fail input validation.
      ktx2: ${{ github.event_name == 'schedule' || inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  pipeline_manual:
    name: Build and publish manually selected resources
    if: ${{ github.event_name == 'workflow_dispatch' && (!inputs.tgw_mode || inputs.tgw_mode == 'normal') && inputs.server != 'intl' && inputs.server != 'jp' && inputs.server != 'intl-test' && inputs.server != 'all' }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: ${{ inputs.github_environment || format('resource-{0}', inputs.server) }}
      server: ${{ inputs.server }}
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      ktx2: ${{ inputs.ktx2 || false }}
      basis_reencode: ${{ inputs.basis_reencode || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      jp_version_subscription: ${{ secrets.JP_VERSION_SUBSCRIPTION }}

  current_tgw_projection:
    name: Prepare or publish reviewed current TGW entities
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tgw_mode && inputs.tgw_mode != 'normal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ inputs.server == 'jp' && 'resource-jp' || 'resource-intl' }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
    steps:
      - name: Require one production server
        env:
          RESOURCE_SERVER: ${{ inputs.server }}
        run: |
          case "$RESOURCE_SERVER" in jp|intl) ;; *) echo "TGW projection requires jp or intl" >&2; exit 1 ;; esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the existing small R2/compiler import closure
        run: |
          python scripts/publish/reference_postpin.py --bootstrap "$RUNNER_TEMP/tgw-dependencies"
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/tgw-dependencies/requirements.txt"
      - name: Prepare current TGW entities or publish the exact reviewed candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PRODUCER_PIN: ${{ github.sha }}
          RESOURCE_SERVER: ${{ inputs.server }}
          TGW_MODE: ${{ inputs.tgw_mode }}
          TGW_INPUT_JSON: ${{ inputs.tgw_input_json }}
          TGW_APPROVAL_JSON: ${{ inputs.tgw_approval_json }}
        run: python scripts/publish/tgw_current.py --output "$RUNNER_TEMP/tgw-output"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tgw-current-${{ inputs.server }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tgw-output/*.json
          if-no-files-found: ignore
          retention-days: 7

  rebuild-site:
    name: Rebuild site pages
    needs: [pipeline_intl, pipeline_jp, pipeline_intl_test]
    # Rebuild once after either production server promotes an immutable release.
    if: ${{ always() && (needs.pipeline_intl.outputs.release_promoted == 'true' || needs.pipeline_jp.outputs.release_promoted == 'true' || needs.pipeline_intl_test.outputs.release_promoted == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch site build after the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Rebuild Sonolus presentation from promoted Intl resources
        if: ${{ vars.ENABLE_SONOLUS_PUBLICATION == 'true' && needs.pipeline_intl.outputs.release_promoted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sonolus.yml --repo "$GITHUB_REPOSITORY" --ref main
