name: Resource pipeline

on:
  schedule:
    # Daily at 11:24 Asia/Shanghai. Japan joins after its Android catalog feed is verified.
    - cron: "24 3 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id
        required: true
        default: intl
        type: string
      github_environment:
        description: GitHub Actions environment for the run
        required: false
        default: resource-intl
        type: string
      package_r2_key:
        description: Private R2 CAS key of one APK, APKS, or XAPK file
        required: false
        type: string
      source_id:
        description: Existing immutable R2 source id to resume without ingestion
        required: false
        type: string
      ktx2:
        description: Build optional KTX2 derivatives
        required: false
        default: false
        type: boolean
concurrency:
  group: resource-pipeline-${{ github.event_name == 'schedule' && 'production-daily' || inputs.server }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Build and publish resources
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(github.event_name == 'schedule' && '["intl"]' || format('["{0}"]', inputs.server)) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: resource-${{ matrix.server }}
      server: ${{ matrix.server }}
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      ktx2: ${{ inputs.ktx2 }}
    secrets:
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
