name: Resource pipeline

on:
  schedule:
    # 00:05, 06:05, 12:05, 18:05 Asia/Tokyo (UTC+9) for jp and intl.
    - cron: "5 3 * * *"
    - cron: "5 9 * * *"
    - cron: "5 15 * * *"
    - cron: "5 21 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: Server configuration id
        required: true
        default: intl
        type: string
      github_environment:
        description: GitHub Actions environment for the run
        required: false
        default: resource-intl
        type: string
      package_r2_key:
        description: Private R2 CAS key of one APK, APKS, or XAPK file
        required: false
        type: string
      source_id:
        description: Existing immutable R2 source id to resume without ingestion
        required: false
        type: string
      ktx2:
        description: Build optional KTX2 derivatives
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the source identity is unchanged
        required: false
        default: false
        type: boolean
      no_reuse:
        description: Disable cross-source and cross-build artifact reuse
        required: false
        default: false
        type: boolean
concurrency:
  group: resource-pipeline-${{ github.event_name == 'schedule' && 'production-daily' || inputs.server }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Build and publish resources
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(github.event_name == 'schedule' && '["jp", "intl"]' || format('["{0}"]', inputs.server)) }}
    permissions:
      contents: read
    uses: ./.github/workflows/resource-pipeline-run.yml
    with:
      github_environment: resource-${{ matrix.server }}
      server: ${{ matrix.server }}
      package_r2_key: ${{ inputs.package_r2_key }}
      source_id: ${{ inputs.source_id }}
      # On schedule events the inputs context is empty, which would feed ''
      # into boolean-typed callee inputs and fail input validation.
      ktx2: ${{ inputs.ktx2 || false }}
      force: ${{ inputs.force || false }}
      no_reuse: ${{ inputs.no_reuse || false }}
    secrets:
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      resource_cdn_authorization: ${{ secrets.RESOURCE_CDN_AUTHORIZATION }}
      secret_writer_gh_token: ${{ secrets.SECRET_WRITER_GH_TOKEN }}
      haneoka_version_endpoint: ${{ secrets.HANEOKA_VERSION_ENDPOINT }}

  rebuild-static-catalog:
    name: Rebuild static catalog pages
    needs: pipeline
    # The searchable routes use the intl catalog as their build-time data source.
    if: ${{ github.event_name == 'schedule' || inputs.server == 'intl' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch site build after the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
