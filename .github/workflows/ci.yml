name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Verify complete frontend
    uses: ./.github/workflows/static-frontend.yml
    with:
      verification_only: true
  build:
    name: Build
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROVIDER_STATIC_SNAPSHOT: data/provider-static/snapshots/${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules

      - name: Verify offline static render transport
        run: |
          node scripts/verify/static-render-transport.mjs .output/build-speed/transport.json
          node scripts/verify/catalog-page-projector.mjs
          node scripts/verify/frozen-entity-projection.mjs
          node scripts/verify/catalog-page-snapshot.mjs

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Set up the locked Vega Rust and WASM toolchain
        uses: ./.dependencies/vega/.github/actions/setup-wasm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify

      - name: Restore verified provider HTTP responses
        id: provider-http-cache
        uses: actions/cache/restore@v6
        with:
          path: data/provider-static/http-cache
          key: ci-provider-http-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-provider-http-v1-${{ runner.os }}-
            provider-http-v1-${{ runner.os }}-

      - name: Restore this run's captured provider inputs and payloads
        id: provider-snapshot-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            data/provider-static/snapshots
            data/provider-static/entities/payloads
            data/provider-static/entities/receipts
          key: ci-provider-snapshot-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-provider-snapshot-v1-${{ runner.os }}-${{ github.run_id }}-

      - name: Check compiled frontend sources
        run: |
          pnpm build:packages
          pnpm lint:frontend

      - name: Save verified provider HTTP responses
        if: always() && steps.provider-http-cache.outputs.cache-primary-key != '' && steps.provider-http-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@v6
        with:
          path: data/provider-static/http-cache
          key: ${{ steps.provider-http-cache.outputs.cache-primary-key }}

      - name: Save this run's captured provider inputs and payloads
        if: always() && steps.provider-snapshot-cache.outputs.cache-primary-key != '' && steps.provider-snapshot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@v6
        with:
          path: |
            data/provider-static/snapshots
            data/provider-static/entities/payloads
            data/provider-static/entities/receipts
          key: ${{ steps.provider-snapshot-cache.outputs.cache-primary-key }}

      - name: Check resource pipeline
        run: |
          python3 -m unittest discover -s scripts/garupa_master/tests -t .
