name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify

      - name: Generate production application
        run: pnpm build
        env:
          HANEOKA_CUBISM_RUNTIME_POLICY: optional

      - name: Check resource pipeline
        run: python3 -m unittest discover -s scripts/garupa_master/tests -t .
