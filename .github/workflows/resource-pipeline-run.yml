name: Resource pipeline implementation

on:
  workflow_call:
    inputs:
      github_environment:
        required: true
        type: string
      server:
        required: true
        type: string
      package_r2_key:
        required: false
        type: string
      source_id:
        required: false
        type: string
      ktx2:
        required: false
        default: false
        type: boolean
    secrets:
      cloudflare_account_id:
        required: true
      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      resource_cdn_authorization:
        required: false

env:
  RESOURCE_SERVER: ${{ inputs.server }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare_account_id }}
  AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
  AWS_EC2_METADATA_DISABLED: "true"
  PIPELINE_STAGE_BUCKET: hotdori-assets
  PIPELINE_STAGE_PREFIX: private/resource-pipeline-stage/${{ github.run_id }}/${{ inputs.server }}
  PYTHONPATH: scripts

jobs:
  prepare:
    name: Normalize and publish source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.github_environment }}
    permissions:
      contents: read
    outputs:
      source_id: ${{ steps.identity.outputs.source_id }}
      build_id: ${{ steps.identity.outputs.build_id }}
      shard_count: ${{ steps.identity.outputs.shard_count }}
      shard_matrix: ${{ steps.identity.outputs.shard_matrix }}
      skip: ${{ steps.source_input.outputs.skip }}
    env:
      PACKAGE_R2_KEY: ${{ inputs.package_r2_key }}
      SOURCE_ID_INPUT: ${{ inputs.source_id }}
      RESOURCE_CDN_AUTHORIZATION: ${{ secrets.RESOURCE_CDN_AUTHORIZATION || secrets.resource_cdn_authorization }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Materialize source input
        id: source_input
        run: |
          if [[ -n "$SOURCE_ID_INPUT" ]]; then
            python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source \
              --source "$SOURCE_ID_INPUT" --role package > "$RUNNER_TEMP/source.json"
          else
            if [[ -z "$PACKAGE_R2_KEY" ]]; then
              python scripts/acquire_package.py --server "$RESOURCE_SERVER" \
                --output "$RUNNER_TEMP/discovered-package" > "$RUNNER_TEMP/discovered-package.json"
              PACKAGE_R2_KEY="$(jq -r .casKey "$RUNNER_TEMP/discovered-package.json")"
              package_sha="$(jq -r .sha256 "$RUNNER_TEMP/discovered-package.json")"
              package_size="$(jq -r .bytes "$RUNNER_TEMP/discovered-package.json")"
              endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
              if aws s3api head-object --bucket "$PIPELINE_STAGE_BUCKET" \
                --key "$PACKAGE_R2_KEY" --endpoint-url "$endpoint" --region auto \
                --query '[ContentLength,Metadata.sha256]' --output text \
                > "$RUNNER_TEMP/package-head" 2>/dev/null; then
                read -r remote_size remote_sha < "$RUNNER_TEMP/package-head"
                if [[ "$remote_size" != "$package_size" || ( "$remote_sha" != "None" && "$remote_sha" != "$package_sha" ) ]]; then
                  echo "Existing R2 package CAS object has mismatched metadata" >&2
                  exit 1
                fi
              else
                aws s3 cp "$RUNNER_TEMP/discovered-package" \
                  "s3://$PIPELINE_STAGE_BUCKET/$PACKAGE_R2_KEY" \
                  --endpoint-url "$endpoint" --region auto --no-progress \
                  --metadata "sha256=$package_sha" \
                  --content-type application/octet-stream
              fi
            fi
            python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-package \
              --key "$PACKAGE_R2_KEY" --output "$RUNNER_TEMP/package-input"
            python scripts/pipeline.py --server "$RESOURCE_SERVER" probe-source \
              --input "$RUNNER_TEMP/package-input" > "$RUNNER_TEMP/source-probe.json"
            probed_source="$(jq -r .sourceId "$RUNNER_TEMP/source-probe.json")"
            wanted_build="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" build-id \
              --source "$probed_source" | jq -r .buildId)"
            wanted_fingerprint="${wanted_build: -16}"
            if aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/servers/$RESOURCE_SERVER/current.json" \
              "$RUNNER_TEMP/current-pointer.json" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto --no-progress 2>/dev/null; then
              current_source="$(jq -r .sourceId "$RUNNER_TEMP/current-pointer.json")"
              current_fingerprint="$(jq -r '.pipelineFingerprint // empty' "$RUNNER_TEMP/current-pointer.json")"
              if [[ "$current_source" == "$probed_source" && "$current_fingerprint" == "$wanted_fingerprint" ]]; then
                echo "Source and pipeline fingerprint are unchanged; skipping this build"
                cp "$RUNNER_TEMP/source-probe.json" "$RUNNER_TEMP/source.json"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # Prefer the live CDN catalog; fall back to the package's embedded
            # assets/aa/catalog.bin only when the remote ingest cannot resolve one.
            if ! python scripts/pipeline.py --server "$RESOURCE_SERVER" ingest \
              --input "$RUNNER_TEMP/package-input" > "$RUNNER_TEMP/source.json"; then
              if unzip -l "$RUNNER_TEMP/package-input" "assets/aa/catalog.bin" > /dev/null 2>&1; then
                echo "remote catalog ingest failed; retrying with the embedded catalog" >&2
                unzip -p "$RUNNER_TEMP/package-input" "assets/aa/catalog.bin" \
                  > "$RUNNER_TEMP/embedded-catalog.bin"
              elif unzip -l "$RUNNER_TEMP/package-input" "UnityDataAssetPack.apk" > /dev/null 2>&1; then
                echo "remote catalog ingest failed; retrying with the XAPK asset-pack catalog" >&2
                unzip -p "$RUNNER_TEMP/package-input" "UnityDataAssetPack.apk" \
                  > "$RUNNER_TEMP/UnityDataAssetPack.apk"
                unzip -p "$RUNNER_TEMP/UnityDataAssetPack.apk" "assets/aa/catalog.bin" \
                  > "$RUNNER_TEMP/embedded-catalog.bin"
              else
                exit 1
              fi
              if [[ -s "$RUNNER_TEMP/embedded-catalog.bin" ]]; then
                export HANEOKA_SOURCE_CATALOG="$RUNNER_TEMP/embedded-catalog.bin"
                python scripts/pipeline.py --server "$RESOURCE_SERVER" ingest \
                  --input "$RUNNER_TEMP/package-input" > "$RUNNER_TEMP/source.json"
              else
                exit 1
              fi
            fi
          fi
      - name: Export build identity
        id: identity
        run: |
          SOURCE_ID="$(jq -r .sourceId "$RUNNER_TEMP/source.json")"
          BUILD_ID="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" build-id --source "$SOURCE_ID" | jq -r .buildId)"
          SHARD_COUNT="$(jq -r .extractionShards "scripts/config/servers/$RESOURCE_SERVER.json")"
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "shard_count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          echo "shard_matrix=$(python -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$SHARD_COUNT")" >> "$GITHUB_OUTPUT"
      - name: Publish source CAS
        if: steps.source_input.outputs.skip != 'true'
        run: |
          if [[ -z "$SOURCE_ID_INPUT" ]]; then
            python scripts/pipeline.py --server "$RESOURCE_SERVER" publish-source \
              --source "${{ steps.identity.outputs.source_id }}"
          fi
      - name: Extract Master
        if: steps.source_input.outputs.skip != 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-master
          --source "${{ steps.identity.outputs.source_id }}"
          --build "${{ steps.identity.outputs.build_id }}"
      - name: Preserve Master build stage in private R2
        if: steps.source_input.outputs.skip != 'true'
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ steps.identity.outputs.build_id }}"
          archive="$RUNNER_TEMP/resource-master.tar.gz"
          tar --create --gzip --file "$archive" --directory "$build_root" master
          aws s3 cp "$archive" \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/resource-master.tar.gz" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

  unity:
    name: Unity shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Fetch this shard's original bundles
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source
          --source "${{ needs.prepare.outputs.source_id }}"
          --role unity-bundle
          --shard-index "${{ matrix.shard }}"
          --shard-count "${{ needs.prepare.outputs.shard_count }}"
      - name: Extract Unity shard
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-unity
          --source "${{ needs.prepare.outputs.source_id }}"
          --build "${{ needs.prepare.outputs.build_id }}"
          --shard-index "${{ matrix.shard }}"
          --shard-count "${{ needs.prepare.outputs.shard_count }}"
      - name: Preserve deterministic shard in private R2
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive="$RUNNER_TEMP/unity-shard-${{ matrix.shard }}.tar.gz"
          tar --create --gzip --file "$archive" --directory "$build_root" shards
          aws s3 cp "$archive" \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-shard-${{ matrix.shard }}.tar.gz" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

  release:
    name: Assemble and publish release
    needs: [prepare, unity]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      HANEOKA_MODEL_PREVIEW_POLICY: required
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim unused hosted-runner SDK space
        run: |
          # This job uses Node, Python and FFmpeg. The preinstalled Android,
          # .NET, Swift and Haskell SDKs consume disk needed by full Unity media.
          sudo rm -rf -- \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h .
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout
      - name: Install pnpm
        run: corepack enable
      - name: Install workspace dependencies
        # build-api bundles the Sonolus chart converter
        # (packages/sonolus/src/convert/index.ts) through esbuild at build
        # time, so the release job needs the workspace dependency tree
        # (esbuild + the converter), the same way sonolus.yml sets it up.
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Provision licensed Cubism runtime
        uses: ./.github/actions/setup-cubism-runtime
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Restore pinned vgmstream
        id: vgmstream-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli
          key: vgmstream-r2117-${{ runner.os }}-${{ runner.arch }}
      - name: Download pinned vgmstream
        if: steps.vgmstream-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 5 --output "$RUNNER_TEMP/vgmstream.zip" \
            https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip
          mkdir -p "${{ runner.temp }}/haneoka-tools/vgmstream/r2117"
          unzip -p "$RUNNER_TEMP/vgmstream.zip" vgmstream-cli \
            > "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
          chmod 755 "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
      - name: Save pinned vgmstream
        if: steps.vgmstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli
          key: vgmstream-r2117-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned vgmstream
        run: >-
          sudo install "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
          /usr/local/bin/vgmstream-cli
      - name: Restore pinned Basis Universal encoder
        if: ${{ inputs.ktx2 }}
        id: basisu-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/basisu/1aab02ba2df16ad873229030ea191ea8c10e3fc9/basisu
          key: basisu-1aab02ba2df16ad873229030ea191ea8c10e3fc9-${{ runner.os }}-${{ runner.arch }}
      - name: Build pinned Basis Universal encoder
        if: inputs.ktx2 && steps.basisu-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/basis-universal"
          git -C "$RUNNER_TEMP/basis-universal" remote add origin https://github.com/BinomialLLC/basis_universal.git
          git -C "$RUNNER_TEMP/basis-universal" fetch --depth=1 origin 1aab02ba2df16ad873229030ea191ea8c10e3fc9
          git -C "$RUNNER_TEMP/basis-universal" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/basis-universal" -B "$RUNNER_TEMP/basis-universal/build" -DCMAKE_BUILD_TYPE=Release -DBASISU_SSE=TRUE
          cmake --build "$RUNNER_TEMP/basis-universal/build" --config Release --parallel 2
          mkdir -p "${{ runner.temp }}/haneoka-tools/basisu/1aab02ba2df16ad873229030ea191ea8c10e3fc9"
          install "$RUNNER_TEMP/basis-universal/bin/basisu" \
            "${{ runner.temp }}/haneoka-tools/basisu/1aab02ba2df16ad873229030ea191ea8c10e3fc9/basisu"
      - name: Save pinned Basis Universal encoder
        if: inputs.ktx2 && steps.basisu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/basisu/1aab02ba2df16ad873229030ea191ea8c10e3fc9/basisu
          key: basisu-1aab02ba2df16ad873229030ea191ea8c10e3fc9-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Basis Universal encoder
        if: ${{ inputs.ktx2 }}
        run: >-
          sudo install
          "${{ runner.temp }}/haneoka-tools/basisu/1aab02ba2df16ad873229030ea191ea8c10e3fc9/basisu"
          /usr/local/bin/basisu
      - name: Restore Master stage from private R2
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive="$RUNNER_TEMP/resource-master.tar.gz"
          mkdir -p "$build_root"
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/resource-master.tar.gz" \
            "$archive" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress
          tar --extract --gzip --file "$archive" --directory "$build_root"
          rm -f "$archive"
      - name: Restore all Unity shards from private R2
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive_root="$RUNNER_TEMP/unity-shards"
          mkdir -p "$archive_root" "$build_root"
          for attempt in 1 2 3 4 5; do
            aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/" \
              "$archive_root/" \
              --recursive \
              --exclude "*" \
              --include "unity-shard-*.tar.gz" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto \
              --no-progress && break
            echo "restore attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          mapfile -t archives < <(find "$archive_root" -maxdepth 1 -type f -name 'unity-shard-*.tar.gz' -print | sort)
          expected="${{ needs.prepare.outputs.shard_count }}"
          if [[ "${#archives[@]}" -ne "$expected" ]]; then
            echo "Expected $expected Unity shard archives, found ${#archives[@]}" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            tar --extract --gzip --file "$archive" --directory "$build_root"
            rm -f "$archive"
          done
      - name: Fetch original CRI payloads
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source
          --source "${{ needs.prepare.outputs.source_id }}"
          --role cri-payload
      - name: Merge Unity shards
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          SHARDS="${{ needs.prepare.outputs.shard_count }}"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" merge-unity --source "$SOURCE_ID" --build "$BUILD_ID" --shard-count "$SHARDS"
      - name: Fetch original Home Spot bundles
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-home-spots
          --source "${{ needs.prepare.outputs.source_id }}"
          --build "${{ needs.prepare.outputs.build_id }}"
          --concurrency 32
      - name: Build independent runtime stages
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          names=()
          pids=()
          run_stage() {
            local name="$1"
            shift
            "$@" > "$RUNNER_TEMP/$name.log" 2>&1
          }
          run_stage cri python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-cri --source "$SOURCE_ID" --build "$BUILD_ID" --concurrency 2 --reuse-current --reuse-concurrency 64 &
          names+=(cri)
          pids+=("$!")
          run_stage live2d python scripts/pipeline.py --server "$RESOURCE_SERVER" build-live2d --source "$SOURCE_ID" --build "$BUILD_ID" &
          names+=(live2d)
          pids+=("$!")
          run_stage spine python scripts/pipeline.py --server "$RESOURCE_SERVER" build-spine --source "$SOURCE_ID" --build "$BUILD_ID" &
          names+=(spine)
          pids+=("$!")
          run_stage home-spots python scripts/pipeline.py --server "$RESOURCE_SERVER" build-home-spots --source "$SOURCE_ID" --build "$BUILD_ID" &
          names+=(home-spots)
          pids+=("$!")
          if [[ "${{ inputs.ktx2 }}" == "true" ]]; then
            run_stage ktx2 python scripts/pipeline.py --server "$RESOURCE_SERVER" build-ktx2 --source "$SOURCE_ID" --build "$BUILD_ID" &
            names+=(ktx2)
            pids+=("$!")
          fi
          failed=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              failed=1
            fi
            cat "$RUNNER_TEMP/${names[$index]}.log"
          done
          exit "$failed"
      - name: Release decoded CRI source copies
        run: |
          # Immutable originals remain in R2 CAS. No subsequent build stage
          # reads this local 4–5 GiB source directory after CRI extraction.
          rm -rf -- "data/servers/$RESOURCE_SERVER/sources/${{ needs.prepare.outputs.source_id }}/android/cri"
      - name: Assemble release
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" build-api --source "$SOURCE_ID" --build "$BUILD_ID"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" build-release --source "$SOURCE_ID" --build "$BUILD_ID" > "$RUNNER_TEMP/release.json"
      - name: Publish CAS delta and switch current release
        run: |
          RELEASE_ID="$(jq -r .releaseId "$RUNNER_TEMP/release.json")"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" publish-release \
            --release "$RELEASE_ID" --fast --concurrency 64

  cleanup:
    name: Remove private R2 build stages
    needs: [prepare, unity, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Remove this run's temporary objects
        run: >-
          aws s3 rm
          "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/"
          --recursive
          --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          --region auto
