name: Resource pipeline implementation

concurrency:
  group: resource-build-server-${{ inputs.server }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      github_environment:
        required: true
        type: string
      server:
        required: true
        type: string
      package_r2_key:
        required: false
        type: string
      source_id:
        required: false
        type: string
      ktx2:
        required: false
        default: true
        type: boolean
      basis_reencode:
        required: false
        default: false
        type: boolean
      force:
        required: false
        default: false
        type: boolean
      no_reuse:
        required: false
        default: false
        type: boolean
    outputs:
      release_promoted:
        description: Whether this invocation promoted a new current release.
        value: ${{ jobs.release.outputs.release_promoted }}
    secrets:
      RESOURCE_PIPELINE_CONFIG:
        required: true
      cloudflare_account_id:
        required: true
      r2_access_key_id:
        required: true
      r2_secret_access_key:
        required: true
      resource_cdn_authorization:
        required: false
      secret_writer_gh_token:
        required: false
      jp_version_subscription:
        required: false

env:
  RESOURCE_SERVER: ${{ inputs.server }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare_account_id }}
  AWS_ACCESS_KEY_ID: ${{ secrets.r2_access_key_id }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.r2_secret_access_key }}
  AWS_EC2_METADATA_DISABLED: "true"
  PIPELINE_STAGE_BUCKET: hotdori-assets
  PIPELINE_STAGE_PREFIX: private/resource-pipeline-stage/${{ github.run_id }}/${{ inputs.server }}
  PYTHONPATH: scripts

jobs:
  prepare:
    name: Normalize and publish source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.github_environment }}
    permissions:
      contents: read
    outputs:
      source_id: ${{ steps.identity.outputs.source_id }}
      build_id: ${{ steps.identity.outputs.build_id }}
      shard_count: ${{ steps.identity.outputs.shard_count }}
      shard_matrix: ${{ steps.identity.outputs.shard_matrix }}
      shard_archives: ${{ steps.stage_shards.outputs.available }}
      skip: ${{ steps.source_input.outputs.skip }}
      delta: ${{ steps.unity_reuse.outputs.delta }}
      base_release_id: ${{ steps.unity_reuse.outputs.base_release_id }}
      pending_by_shard: ${{ steps.unity_reuse.outputs.pending_by_shard }}
      unity_matrix: ${{ steps.unity_reuse.outputs.unity_matrix || steps.identity.outputs.unity_matrix }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      PACKAGE_R2_KEY: ${{ inputs.package_r2_key }}
      SOURCE_ID_INPUT: ${{ inputs.source_id }}
      RESOURCE_CDN_AUTHORIZATION: ${{ secrets.RESOURCE_CDN_AUTHORIZATION || secrets.resource_cdn_authorization }}
      JP_VERSION_SUBSCRIPTION: ${{ secrets.jp_version_subscription }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Start JP API egress proxy
        if: startsWith(inputs.server, 'jp') && env.JP_VERSION_SUBSCRIPTION != ''
        uses: ./.github/actions/setup-jp-api-egress
        with:
          subscription_url: ${{ env.JP_VERSION_SUBSCRIPTION }}
      - name: Materialize source input
        id: source_input
        run: |
          if [[ -n "$SOURCE_ID_INPUT" ]]; then
            python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source \
              --source "$SOURCE_ID_INPUT" --role package --role master-manifest --role master-data > "$RUNNER_TEMP/source.json"
          else
            if [[ -z "$PACKAGE_R2_KEY" && "${{ inputs.no_reuse }}" != "true" ]]; then
              # Reuse the stored package when the publisher fingerprint is
              # unchanged; only a real update pays the publisher download.
              current_json="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" current-package || true)"
              probe_json="$(python scripts/acquire_package.py --server "$RESOURCE_SERVER" --probe || true)"
              probe_fp="{}"
              if [[ -n "$probe_json" ]]; then
                probe_fp="$(printf '%s' "$probe_json" | jq -c 'with_entries(select(.value | type == "string")) | del(.server, .provenance)')"
                export HANEOKA_PACKAGE_FINGERPRINT="$probe_fp"
              fi
              reuse_key=""
              if [[ -n "$current_json" && -n "$probe_json" ]]; then
                reuse_key="$(printf '%s' "$current_json" | jq -r --arg fp "$probe_fp" '
                  . as $c | ($fp | fromjson) as $p |
                  select($c.available == true) |
                  (if (($c.publisher // {}) | length) > 0 then
                     ($c.publisher == $p)
                   else
                     (($p.versionCode // "") != "" or ($p.versionName // "") != "") and
                     (($p.versionCode // "") == "" or $c.versionCode == "" or $p.versionCode == $c.versionCode) and
                     (($p.versionName // "") == "" or $c.versionName == "" or $p.versionName == $c.versionName)
                   end) |
                  select(.) | $c.casKey
                ' || true)"
              fi
              if [[ -n "$reuse_key" ]]; then
                echo "Publisher package unchanged; reusing R2 package $reuse_key"
                PACKAGE_R2_KEY="$reuse_key"
                # With the package unchanged, fresh catalogs and Master data
                # decide the source identity without transferring the package.
                identity_json=""
                if [[ "${{ inputs.force }}" != "true" ]]; then
                  identity_json="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" probe-identity || true)"
                fi
                if [[ -n "$identity_json" ]]; then
                  probed_source="$(printf '%s' "$identity_json" | jq -r .sourceId)"
                  wanted_build="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" build-id --source "$probed_source" | jq -r .buildId)"
                  wanted_fingerprint="${wanted_build: -16}"
                  stage_endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
                  if aws s3 cp                       "s3://$PIPELINE_STAGE_BUCKET/servers/$RESOURCE_SERVER/current.json"                       "$RUNNER_TEMP/current-pointer.json"                       --endpoint-url "$stage_endpoint" --region auto --no-progress 2>/dev/null; then
                    current_source="$(jq -r .sourceId "$RUNNER_TEMP/current-pointer.json")"
                    current_fingerprint="$(jq -r '.pipelineFingerprint // empty' "$RUNNER_TEMP/current-pointer.json")"
                    if [[ "$current_source" == "$probed_source" && "$current_fingerprint" == "$wanted_fingerprint" ]]; then
                      echo "Source identity unchanged without any package transfer; skipping this build"
                      printf '%s\n' "$identity_json" > "$RUNNER_TEMP/source-probe.json"
                      cp "$RUNNER_TEMP/source-probe.json" "$RUNNER_TEMP/source.json"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  fi
                fi
              fi
            fi
            if [[ -z "$PACKAGE_R2_KEY" ]]; then
              python scripts/acquire_package.py --server "$RESOURCE_SERVER" \
                --output "$RUNNER_TEMP/discovered-package" > "$RUNNER_TEMP/discovered-package.json"
              PACKAGE_R2_KEY="$(jq -r .casKey "$RUNNER_TEMP/discovered-package.json")"
              package_sha="$(jq -r .sha256 "$RUNNER_TEMP/discovered-package.json")"
              package_size="$(jq -r .bytes "$RUNNER_TEMP/discovered-package.json")"
              endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
              if aws s3api head-object --bucket "$PIPELINE_STAGE_BUCKET" \
                --key "$PACKAGE_R2_KEY" --endpoint-url "$endpoint" --region auto \
                --query '[ContentLength,Metadata.sha256]' --output text \
                > "$RUNNER_TEMP/package-head" 2>/dev/null; then
                read -r remote_size remote_sha < "$RUNNER_TEMP/package-head"
                if [[ "$remote_size" != "$package_size" || ( "$remote_sha" != "None" && "$remote_sha" != "$package_sha" ) ]]; then
                  echo "Existing R2 package CAS object has mismatched metadata" >&2
                  exit 1
                fi
              else
                aws s3 cp "$RUNNER_TEMP/discovered-package" \
                  "s3://$PIPELINE_STAGE_BUCKET/$PACKAGE_R2_KEY" \
                  --endpoint-url "$endpoint" --region auto --no-progress \
                  --metadata "sha256=$package_sha" \
                  --content-type application/octet-stream
              fi
            fi
            python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-package \
              --key "$PACKAGE_R2_KEY" --output "$RUNNER_TEMP/package-input"
            python scripts/pipeline.py --server "$RESOURCE_SERVER" probe-source \
              --input "$RUNNER_TEMP/package-input" > "$RUNNER_TEMP/source-probe.json"
            probed_source="$(jq -r .sourceId "$RUNNER_TEMP/source-probe.json")"
            wanted_build="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" build-id \
              --source "$probed_source" | jq -r .buildId)"
            wanted_fingerprint="${wanted_build: -16}"
            if aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/servers/$RESOURCE_SERVER/current.json" \
              "$RUNNER_TEMP/current-pointer.json" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto --no-progress 2>/dev/null; then
              current_source="$(jq -r .sourceId "$RUNNER_TEMP/current-pointer.json")"
              current_fingerprint="$(jq -r '.pipelineFingerprint // empty' "$RUNNER_TEMP/current-pointer.json")"
              if [[ "$current_source" == "$probed_source" && "$current_fingerprint" == "$wanted_fingerprint" && "${{ inputs.force }}" != "true" ]]; then
                echo "Source and pipeline fingerprint are unchanged; skipping this build"
                cp "$RUNNER_TEMP/source-probe.json" "$RUNNER_TEMP/source.json"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # Prefer the live CDN catalog; fall back to the package's embedded
            # assets/aa/catalog.bin only when the remote ingest cannot resolve one.
            ingest_extra=(--reuse)
            if [[ "${{ inputs.no_reuse }}" == "true" ]]; then ingest_extra=(); fi
            endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
            current_source_id=""
            if aws s3 cp "s3://$PIPELINE_STAGE_BUCKET/servers/$RESOURCE_SERVER/current.json" \
                "$RUNNER_TEMP/current-pointer.json" --endpoint-url "$endpoint" --region auto --no-progress 2>/dev/null; then
              current_source_id="$(jq -r '.sourceId // empty' "$RUNNER_TEMP/current-pointer.json")"
              if [[ -n "$current_source_id" && "${{ inputs.no_reuse }}" != "true" ]]; then
                # Delta ingestion: adopt unchanged bundle records from the
                # current source without transferring any bytes.
                ingest_extra+=(--base-source "$current_source_id")
              fi
            fi
            if ! python scripts/pipeline.py --server "$RESOURCE_SERVER" ingest \
              --input "$RUNNER_TEMP/package-input" --concurrency 32 "${ingest_extra[@]}" > "$RUNNER_TEMP/source.json"; then
              if [[ "$(python -m core.config --server "$RESOURCE_SERVER" --field has-master)" == "true" ]]; then
                echo "Live Master ingestion failed; retaining the published release" >&2
                exit 1
              fi
              if unzip -l "$RUNNER_TEMP/package-input" "assets/aa/catalog.bin" > /dev/null 2>&1; then
                echo "remote catalog ingest failed; retrying with the embedded catalog" >&2
                unzip -p "$RUNNER_TEMP/package-input" "assets/aa/catalog.bin" \
                  > "$RUNNER_TEMP/embedded-catalog.bin"
              elif unzip -l "$RUNNER_TEMP/package-input" "UnityDataAssetPack.apk" > /dev/null 2>&1; then
                echo "remote catalog ingest failed; retrying with the XAPK asset-pack catalog" >&2
                unzip -p "$RUNNER_TEMP/package-input" "UnityDataAssetPack.apk" \
                  > "$RUNNER_TEMP/UnityDataAssetPack.apk"
                unzip -p "$RUNNER_TEMP/UnityDataAssetPack.apk" "assets/aa/catalog.bin" \
                  > "$RUNNER_TEMP/embedded-catalog.bin"
              else
                exit 1
              fi
              if [[ -s "$RUNNER_TEMP/embedded-catalog.bin" ]]; then
                export HANEOKA_SOURCE_CATALOG="$RUNNER_TEMP/embedded-catalog.bin"
                python scripts/pipeline.py --server "$RESOURCE_SERVER" ingest \
                  --input "$RUNNER_TEMP/package-input" --concurrency 32 "${ingest_extra[@]}" > "$RUNNER_TEMP/source.json"
              else
                exit 1
              fi
            fi
          fi
      - name: Refresh shared CDN credential secret
        env:
          GH_TOKEN: ${{ secrets.secret_writer_gh_token }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "secret_writer_gh_token is not configured; skipping CDN credential refresh" >&2
            exit 0
          fi
          report="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" cdn-credential)"
          auth="$(printf '%s' "$report" | jq -r .authorization)"
          origin="$(printf '%s' "$report" | jq -r .origin)"
          if [[ "$origin" != "server" || -z "$auth" || "$auth" == "null" ]]; then
            echo "No server-issued CDN credential to store (origin: $origin)"
            exit 0
          fi
          echo "::add-mask::$auth"
          if [[ "$auth" == "$RESOURCE_CDN_AUTHORIZATION" ]]; then
            echo "Stored CDN credential secret is already current"
            exit 0
          fi
          printf '%s' "$auth" | gh secret set RESOURCE_CDN_AUTHORIZATION
          echo "Refreshed RESOURCE_CDN_AUTHORIZATION from the $RESOURCE_SERVER server lookup"
      - name: Export build identity
        id: identity
        run: |
          SOURCE_ID="$(jq -r .sourceId "$RUNNER_TEMP/source.json")"
          BUILD_ID="$(python scripts/pipeline.py --server "$RESOURCE_SERVER" build-id --source "$SOURCE_ID" | jq -r .buildId)"
          SHARD_COUNT="$(python -m core.config --server "$RESOURCE_SERVER" --field extraction-shards)"
          echo "source_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "shard_count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          echo "shard_matrix=$(python -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$SHARD_COUNT")" >> "$GITHUB_OUTPUT"
          # Delta runs override this with the shards that hold pending bundles.
          echo "unity_matrix=$(python -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$SHARD_COUNT")" >> "$GITHUB_OUTPUT"
      - name: Publish source CAS
        if: steps.source_input.outputs.skip != 'true'
        run: |
          if [[ -z "$SOURCE_ID_INPUT" ]]; then
            python scripts/pipeline.py --server "$RESOURCE_SERVER" publish-source \
              --source "${{ steps.identity.outputs.source_id }}"
          fi
      - name: Prepare Unity bundle reuse
        id: unity_reuse
        if: steps.source_input.outputs.skip != 'true' && inputs.source_id == '' && inputs.no_reuse != true
        continue-on-error: true
        run: |
          SOURCE_ID="${{ steps.identity.outputs.source_id }}"
          SHARDS="${{ steps.identity.outputs.shard_count }}"
          echo "delta=false" >> "$GITHUB_OUTPUT"
          echo "unity_matrix=${{ steps.identity.outputs.shard_matrix }}" >> "$GITHUB_OUTPUT"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" prepare-unity-reuse \
            --source "$SOURCE_ID" --shard-count "$SHARDS" \
            --output-dir "$RUNNER_TEMP/unity-reuse" > "$RUNNER_TEMP/unity-reuse.json"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          for ((shard=0; shard<SHARDS; shard++)); do
            aws s3 cp "$RUNNER_TEMP/unity-reuse/unity-reuse-$(printf '%03d' "$shard").json" \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-reuse-$(printf '%03d' "$shard").json" \
              --endpoint-url "$endpoint" --region auto --no-progress
          done
          aws s3 cp "$RUNNER_TEMP/unity-reuse/unity-delta-plan.json" \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-delta-plan.json" \
            --endpoint-url "$endpoint" --region auto --no-progress
          base_release="$(jq -r .baseReleaseId "$RUNNER_TEMP/unity-reuse.json")"
          pending_by_shard="$(jq -c '.pendingByShard // {}' "$RUNNER_TEMP/unity-reuse.json")"
          # $shards is the shard count, not an array; range() expands it.
          matrix="$(jq -cn --argjson shards "$SHARDS" --argjson pending "$pending_by_shard" '
            [ range($shards) | tostring | select(($pending[.] // 0) > 0) | tonumber ]')"
          if [[ "$base_release" != "null" && "$base_release" != "" ]]; then
            echo "delta=true" >> "$GITHUB_OUTPUT"
            echo "base_release_id=$base_release" >> "$GITHUB_OUTPUT"
            echo "pending_by_shard=$pending_by_shard" >> "$GITHUB_OUTPUT"
            echo "unity_matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage Unity input archives
        id: stage_shards
        # Delta runs fetch originals directly from CAS in the Unity jobs; the
        # tar staging path is only for full builds (no reusable base).
        if: steps.source_input.outputs.skip != 'true' && inputs.source_id == '' && steps.unity_reuse.outputs.delta != 'true'
        run: |
          SOURCE_ID="${{ steps.identity.outputs.source_id }}"
          SHARDS="${{ steps.identity.outputs.shard_count }}"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          stage_one() {
            local shard="$1"
            local archive="$RUNNER_TEMP/unity-input-$shard.tar"
            python scripts/stage_unity_shard.py --server "$RESOURCE_SERVER" \
              --source "$SOURCE_ID" --shard-index "$shard" \
              --shard-count "$SHARDS" --output "$archive" \
              > "$RUNNER_TEMP/unity-input-$shard.json"
            local digest
            digest="$(jq -r .sha256 "$RUNNER_TEMP/unity-input-$shard.json")"
            printf '%s  %s\n' "$digest" "unity-input-$shard.tar" > "$archive.sha256"
            aws s3 cp "$archive" \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-input-$shard.tar" \
              --endpoint-url "$endpoint" --region auto --no-progress
            aws s3 cp "$archive.sha256" \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-input-$shard.tar.sha256" \
              --endpoint-url "$endpoint" --region auto --no-progress
            rm -f "$archive" "$archive.sha256"
          }
          pids=()
          failed=0
          for ((shard=0; shard<SHARDS; shard++)); do
            stage_one "$shard" &
            pids+=("$!")
            if (( ${#pids[@]} == 4 )); then
              for pid in "${pids[@]}"; do
                if ! wait "$pid"; then failed=1; fi
              done
              pids=()
            fi
          done
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          if (( failed )); then
            echo "Shard archives were incomplete; Unity jobs will fetch immutable CAS objects directly" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract Master
        if: steps.source_input.outputs.skip != 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-master
          --source "${{ steps.identity.outputs.source_id }}"
          --build "${{ steps.identity.outputs.build_id }}"
      - name: Preserve Master build stage in private R2
        if: steps.source_input.outputs.skip != 'true'
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ steps.identity.outputs.build_id }}"
          archive="$RUNNER_TEMP/resource-master.tar.gz"
          tar --create --gzip --file "$archive" --directory "$build_root" master
          aws s3 cp "$archive" \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/resource-master.tar.gz" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

  unity:
    name: Unity shard ${{ matrix.shard }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.unity_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.github_environment }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
    permissions:
      contents: read
    strategy:
      # Delta runs only materialize shards that hold pending bundles; every
      # other shard's outputs are composed from the base release.
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.unity_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Restore this shard's input archive
        if: needs.prepare.outputs.delta != 'true' && needs.prepare.outputs.shard_archives == 'true'
        run: |
          shard="${{ matrix.shard }}"
          archive="$RUNNER_TEMP/unity-input-$shard.tar"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-input-$shard.tar" \
            "$archive" --endpoint-url "$endpoint" --region auto --no-progress
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-input-$shard.tar.sha256" \
            "$archive.sha256" --endpoint-url "$endpoint" --region auto --no-progress
          (cd "$RUNNER_TEMP" && sha256sum -c "unity-input-$shard.tar.sha256")
          source_root="data/servers/$RESOURCE_SERVER/sources/${{ needs.prepare.outputs.source_id }}"
          mkdir -p "$source_root"
          tar --extract --file "$archive" --directory "$source_root"
          rm -f "$archive" "$archive.sha256"
      - name: Fetch this shard's original bundles
        if: needs.prepare.outputs.delta != 'true' && needs.prepare.outputs.shard_archives != 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source
          --source "${{ needs.prepare.outputs.source_id }}"
          --role unity-bundle
          --shard-index "${{ matrix.shard }}"
          --shard-count "${{ needs.prepare.outputs.shard_count }}"
      - name: Fetch delta plan and this shard's pending originals
        if: needs.prepare.outputs.delta == 'true'
        run: |
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-delta-plan.json" \
            "$RUNNER_TEMP/unity-delta-plan.json" \
            --endpoint-url "$endpoint" --region auto --no-progress
          jq -c --argjson shard "${{ matrix.shard }}" '
            [.bundles | to_entries[] | select(.value.shardIndex == $shard) | .key]' \
            "$RUNNER_TEMP/unity-delta-plan.json" > "$RUNNER_TEMP/unity-reusable.json"
          # Fetch only the pending originals; unchanged bundles are composed
          # from the base release. Dependency expansion still pulls any
          # reusable bundles a pending bundle needs for extraction.
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source \
            --source "${{ needs.prepare.outputs.source_id }}" \
            --role unity-bundle \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}" \
            --exclude-sha256-file "$RUNNER_TEMP/unity-reusable.json"
      - name: Fetch Unity reuse manifest
        id: unity_reuse
        if: needs.prepare.outputs.delta != 'true' && inputs.no_reuse != true
        continue-on-error: true
        run: |
          shard="$(printf '%03d' "${{ matrix.shard }}")"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          if aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-reuse-$shard.json" \
              "$RUNNER_TEMP/unity-reuse.json" \
              --endpoint-url "$endpoint" --region auto --no-progress; then
            echo "path=$RUNNER_TEMP/unity-reuse.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract Unity shard
        run: |
          extra=()
          if [[ "${{ needs.prepare.outputs.delta }}" == "true" ]]; then
            extra+=(--delta-plan "$RUNNER_TEMP/unity-delta-plan.json")
          elif [[ -n "${{ steps.unity_reuse.outputs.path }}" ]]; then
            extra+=(--reuse-manifest "${{ steps.unity_reuse.outputs.path }}")
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-unity \
            --source "${{ needs.prepare.outputs.source_id }}" \
            --build "${{ needs.prepare.outputs.build_id }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}" \
            "${extra[@]}"
      - name: Preserve deterministic shard in private R2
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive="$RUNNER_TEMP/unity-shard-${{ matrix.shard }}.tar.gz"
          tar --create --gzip --file "$archive" --directory "$build_root" shards
          aws s3 cp "$archive" \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-shard-${{ matrix.shard }}.tar.gz" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

  release:
    name: Assemble and publish release
    needs: [prepare, unity]
    # A Master/catalog-only update has no pending Unity shards. Release still
    # composes the pinned base after Unity is intentionally skipped.
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' && (needs.unity.result == 'success' || (needs.unity.result == 'skipped' && needs.prepare.outputs.delta == 'true' && needs.prepare.outputs.unity_matrix == '[]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: ${{ inputs.github_environment }}
    permissions:
      contents: read
    outputs:
      release_promoted: ${{ steps.publish_release.outputs.release_promoted }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      HANEOKA_MODEL_PREVIEW_POLICY: required
      HANEOKA_MODEL_PREVIEW_WORKERS: "4"
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim unused hosted-runner SDK space
        run: |
          # This job uses Node, Python and FFmpeg. The preinstalled Android,
          # .NET, Swift and Haskell SDKs consume disk needed by full Unity media.
          sudo rm -rf -- \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h .
      - name: Install pnpm
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules
      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout
      - name: Install workspace dependencies
        # build-api bundles the Sonolus chart converter
        # (packages/sonolus/src/convert/index.ts) through esbuild at build
        # time, so the release job needs the workspace dependency tree
        # (esbuild + the converter), the same way sonolus.yml sets it up.
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-resource-pipeline
      - name: Provision licensed Cubism runtime
        uses: ./.github/actions/setup-cubism-runtime
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Restore KTX-Software
        id: ktx-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/ktx/4.4.2
          key: ktx-4.4.2-${{ runner.os }}-${{ runner.arch }}
      - name: Download verified KTX-Software
        if: steps.ktx-cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/ktx.tar.bz2"
          curl --fail --location --retry 5 --max-time 180 --output "$archive" \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2
          echo "a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/haneoka-tools/ktx/4.4.2"
          tar -xjf "$archive" --strip-components=1 --directory "$RUNNER_TEMP/haneoka-tools/ktx/4.4.2"
          rm -f "$archive"
      - name: Enable native texture packaging
        run: |
          executable="$RUNNER_TEMP/haneoka-tools/ktx/4.4.2/bin/ktx"
          "$executable" --version
          echo "KTX_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - name: Restore pinned vgmstream
        id: vgmstream-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli
          key: vgmstream-r2117-${{ runner.os }}-${{ runner.arch }}
      - name: Download pinned vgmstream
        if: steps.vgmstream-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 5 --output "$RUNNER_TEMP/vgmstream.zip" \
            https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip
          mkdir -p "${{ runner.temp }}/haneoka-tools/vgmstream/r2117"
          unzip -p "$RUNNER_TEMP/vgmstream.zip" vgmstream-cli \
            > "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
          chmod 755 "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
      - name: Save pinned vgmstream
        if: steps.vgmstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli
          key: vgmstream-r2117-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned vgmstream
        run: >-
          sudo install "${{ runner.temp }}/haneoka-tools/vgmstream/r2117/vgmstream-cli"
          /usr/local/bin/vgmstream-cli
      - name: Restore Master stage from private R2
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive="$RUNNER_TEMP/resource-master.tar.gz"
          mkdir -p "$build_root"
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/resource-master.tar.gz" \
            "$archive" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress
          tar --extract --gzip --file "$archive" --directory "$build_root"
          rm -f "$archive"
      - name: Fetch delta plan
        # Use the same signal the Unity jobs used. Sniffing the staged S3 key
        # desynchronized the two paths whenever the prepare step fell back.
        if: needs.prepare.outputs.delta == 'true'
        run: |
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp \
            "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/unity-delta-plan.json" \
            "$RUNNER_TEMP/unity-delta-plan.json" \
            --endpoint-url "$endpoint" --region auto --no-progress
      - name: Restore all Unity shards from private R2
        if: needs.prepare.outputs.delta != 'true'
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive_root="$RUNNER_TEMP/unity-shards"
          mkdir -p "$archive_root" "$build_root"
          for attempt in 1 2 3 4 5; do
            aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/" \
              "$archive_root/" \
              --recursive \
              --exclude "*" \
              --include "unity-shard-*.tar.gz" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto \
              --no-progress && break
            echo "restore attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          mapfile -t archives < <(find "$archive_root" -maxdepth 1 -type f -name 'unity-shard-*.tar.gz' -print | sort)
          expected="${{ needs.prepare.outputs.shard_count }}"
          if [[ "${#archives[@]}" -ne "$expected" ]]; then
            echo "Expected $expected Unity shard archives, found ${#archives[@]}" >&2
            exit 1
          fi
          # Download with --recursive is already concurrent; spread the gzip
          # decode across cores too instead of one archive at a time.
          printf '%s\n' "${archives[@]}" | xargs -P "$(nproc)" -I '{}' \
            sh -c 'tar --extract --gzip --file "$1" --directory "$2" && rm -f "$1"' _ '{}' "$build_root"
      - name: Restore pending Unity shards from private R2
        if: needs.prepare.outputs.delta == 'true'
        run: |
          build_root="data/servers/$RESOURCE_SERVER/builds/${{ needs.prepare.outputs.build_id }}"
          archive_root="$RUNNER_TEMP/unity-shards"
          mkdir -p "$archive_root" "$build_root"
          for attempt in 1 2 3 4 5; do
            aws s3 cp \
              "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/" \
              "$archive_root/" \
              --recursive \
              --exclude "*" \
              --include "unity-shard-*.tar.gz" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto \
              --no-progress && break
            echo "restore attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          mapfile -t archives < <(find "$archive_root" -maxdepth 1 -type f -name 'unity-shard-*.tar.gz' -print | sort)
          # Only shards with pending bundles ran; everything else is composed.
          # jq's `values` builtin selects non-null inputs; [.pending[]] actually
          # iterates the digest->shard map's shard indices for the count.
          expected="$(jq '[.pending[]] | unique | length' "$RUNNER_TEMP/unity-delta-plan.json")"
          if [[ "${#archives[@]}" -ne "$expected" ]]; then
            echo "Expected $expected pending Unity shard archives, found ${#archives[@]}" >&2
            exit 1
          fi
          printf '%s\n' "${archives[@]}" | xargs -P "$(nproc)" -I '{}' \
            sh -c 'tar --extract --gzip --file "$1" --directory "$2" && rm -f "$1"' _ '{}' "$build_root"
      - name: Fetch original CRI payloads
        if: needs.prepare.outputs.delta != 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source
          --source "${{ needs.prepare.outputs.source_id }}"
          --role cri-payload
      - name: Fetch changed CRI payloads
        if: needs.prepare.outputs.delta == 'true'
        run: |
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          base_release="$(jq -r .baseReleaseId "$RUNNER_TEMP/unity-delta-plan.json")"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-release-document \
            --release "$base_release" --path metadata/cri.json \
            --output "$RUNNER_TEMP/base-cri.json" > /dev/null
          jq '[.entries[].source.artifactSha256? // empty] | unique' \
            "$RUNNER_TEMP/base-cri.json" > "$RUNNER_TEMP/cri-reusable.json"
          # Originals declared by the base CRI document stay in CAS; the
          # declare-mode stage restores any stragglers it actually needs.
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-source \
            --source "${{ needs.prepare.outputs.source_id }}" \
            --role cri-payload \
            --exclude-sha256-file "$RUNNER_TEMP/cri-reusable.json"
      - name: Merge Unity shards
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          SHARDS="${{ needs.prepare.outputs.shard_count }}"
          extra=()
          if [[ "${{ needs.prepare.outputs.delta }}" == "true" ]]; then
            extra+=(--delta-plan "$RUNNER_TEMP/unity-delta-plan.json")
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" merge-unity --source "$SOURCE_ID" --build "$BUILD_ID" --shard-count "$SHARDS" "${extra[@]}"
      - name: Fetch original Home Spot bundles
        if: needs.prepare.outputs.delta != 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" fetch-home-spots
          --source "${{ needs.prepare.outputs.source_id }}"
          --build "${{ needs.prepare.outputs.build_id }}"
          --concurrency 32
      - name: Build independent runtime stages
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          DELTA="${{ needs.prepare.outputs.delta }}"
          names=()
          pids=()
          run_stage() {
            local name="$1"
            shift
            "$@" > "$RUNNER_TEMP/$name.log" 2>&1
          }
          if [[ "$DELTA" == "true" ]]; then
            # Declare mode: reusable sources and models are composed from the
            # pinned base release; only changed inputs are processed.
            run_stage cri python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-cri --source "$SOURCE_ID" --build "$BUILD_ID" --concurrency 2 --delta-plan "$RUNNER_TEMP/unity-delta-plan.json" --reuse-concurrency 64 &
            pids+=("$!")
            run_stage live2d python scripts/pipeline.py --server "$RESOURCE_SERVER" build-live2d --source "$SOURCE_ID" --build "$BUILD_ID" --delta-plan "$RUNNER_TEMP/unity-delta-plan.json" --reuse-concurrency 64 &
            pids+=("$!")
            run_stage spine python scripts/pipeline.py --server "$RESOURCE_SERVER" build-spine --source "$SOURCE_ID" --build "$BUILD_ID" --delta-plan "$RUNNER_TEMP/unity-delta-plan.json" --reuse-concurrency 64 &
            pids+=("$!")
            run_stage home-spots python scripts/pipeline.py --server "$RESOURCE_SERVER" build-home-spots --source "$SOURCE_ID" --build "$BUILD_ID" --delta-plan "$RUNNER_TEMP/unity-delta-plan.json" &
            pids+=("$!")
          else
            run_stage cri python scripts/pipeline.py --server "$RESOURCE_SERVER" extract-cri --source "$SOURCE_ID" --build "$BUILD_ID" --concurrency 2 --reuse-current --reuse-concurrency 64 &
            pids+=("$!")
            run_stage live2d python scripts/pipeline.py --server "$RESOURCE_SERVER" build-live2d --source "$SOURCE_ID" --build "$BUILD_ID" --reuse-current --reuse-concurrency 64 &
            pids+=("$!")
            run_stage spine python scripts/pipeline.py --server "$RESOURCE_SERVER" build-spine --source "$SOURCE_ID" --build "$BUILD_ID" --reuse-current --reuse-concurrency 64 &
            pids+=("$!")
            run_stage home-spots python scripts/pipeline.py --server "$RESOURCE_SERVER" build-home-spots --source "$SOURCE_ID" --build "$BUILD_ID" &
            pids+=("$!")
          fi
          names+=(cri live2d spine home-spots)
          failed=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              failed=1
            fi
            cat "$RUNNER_TEMP/${names[$index]}.log"
          done
          exit "$failed"
      - name: Package selected runtime texture blocks
        if: ${{ inputs.ktx2 || inputs.basis_reencode }}
        run: |
          extra=()
          if [[ "${{ needs.prepare.outputs.delta }}" == "true" ]]; then
            extra+=(--delta-plan "$RUNNER_TEMP/unity-delta-plan.json")
          fi
          if [[ "${{ inputs.basis_reencode }}" == "true" ]]; then
            extra+=(--basis-reencode)
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" build-ktx2 \
            --source "${{ needs.prepare.outputs.source_id }}" \
            --build "${{ needs.prepare.outputs.build_id }}" "${extra[@]}"
      - name: Release decoded CRI source copies
        run: |
          # Immutable originals remain in R2 CAS. No subsequent build stage
          # reads this local 4–5 GiB source directory after CRI extraction.
          rm -rf -- "data/servers/$RESOURCE_SERVER/sources/${{ needs.prepare.outputs.source_id }}/android/cri"
      - name: Install CPU stamp reconstruction dependencies
        if: inputs.server == 'intl' || inputs.server == 'intl-test'
        run: python -m pip install --disable-pip-version-check --requirement scripts/build/requirements-textless-stamps.txt
      - name: Cache pinned stamp detector
        if: inputs.server == 'intl' || inputs.server == 'intl-test'
        uses: actions/cache@v6
        with:
          path: .cache/stamp-cv
          key: stamp-detector-${{ runner.os }}-${{ hashFiles('scripts/build/textless-stamps-models.json') }}
      - name: Restore verified private Intl stamp bootstrap
        if: inputs.server == 'intl' || inputs.server == 'intl-test'
        run: >-
          python scripts/core/stamp_ci_inputs.py --server "$RESOURCE_SERVER"
          --output "$RUNNER_TEMP/stamp-reviewed"
      - name: Assemble release
        run: |
          SOURCE_ID="${{ needs.prepare.outputs.source_id }}"
          BUILD_ID="${{ needs.prepare.outputs.build_id }}"
          extra=()
          if [[ "${{ needs.prepare.outputs.delta }}" == "true" ]]; then
            extra+=(--delta-plan "$RUNNER_TEMP/unity-delta-plan.json")
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" build-api --source "$SOURCE_ID" --build "$BUILD_ID" "${extra[@]}"
          if [[ "$RESOURCE_SERVER" == "intl" || "$RESOURCE_SERVER" == "intl-test" ]]; then
            stamp_extra=()
            if [[ "$RESOURCE_SERVER" == "intl" || "$RESOURCE_SERVER" == "intl-test" ]]; then
              stamp_extra+=(--seed-manifest "$RUNNER_TEMP/stamp-reviewed/seed/manifest.json"
                --seed-provenance "$RUNNER_TEMP/stamp-reviewed/provenance.json"
                --repair-cache-manifest "$RUNNER_TEMP/stamp-reviewed/repair/manifest.json")
            fi
            python scripts/pipeline.py --server "$RESOURCE_SERVER" build-textless-stamps \
              --source "$SOURCE_ID" --build "$BUILD_ID" --reuse-current "${extra[@]}" "${stamp_extra[@]}"
          fi
          python scripts/pipeline.py --server "$RESOURCE_SERVER" build-release --source "$SOURCE_ID" --build "$BUILD_ID" "${extra[@]}" > "$RUNNER_TEMP/release.json"
      - name: Publish CAS delta and switch current release
        id: publish_release
        run: |
          RELEASE_ID="$(jq -r .releaseId "$RUNNER_TEMP/release.json")"
          python scripts/pipeline.py --server "$RESOURCE_SERVER" publish-release \
            --release "$RELEASE_ID" --concurrency 64 > "$RUNNER_TEMP/publication.json"
          promoted="$(jq -er '.releasePromoted | if type == "boolean" then tostring else error("Invalid publication result") end' "$RUNNER_TEMP/publication.json")"
          echo "release_promoted=$promoted" >> "$GITHUB_OUTPUT"
      - name: Verify promoted release pointer
        if: steps.publish_release.outputs.release_promoted == 'true'
        run: >-
          python scripts/pipeline.py --server "$RESOURCE_SERVER" verify-remote
          --release "$(jq -r .releaseId "$RUNNER_TEMP/release.json")" --fast

  announcements:
    name: Refresh operational announcements
    needs: [prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/announcements.yml
    with:
      server: ${{ inputs.server }}
      github_environment: ${{ inputs.github_environment }}
      source_id: ${{ needs.prepare.outputs.source_id }}
    secrets:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      cloudflare_account_id: ${{ secrets.cloudflare_account_id }}
      r2_access_key_id: ${{ secrets.r2_access_key_id }}
      r2_secret_access_key: ${{ secrets.r2_secret_access_key }}
      resource_cdn_authorization: ${{ secrets.resource_cdn_authorization }}
      jp_version_subscription: ${{ secrets.jp_version_subscription }}

  cleanup:
    name: Remove private R2 build stages
    needs: [prepare, unity, release, announcements]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Remove this run's temporary objects
        run: >-
          aws s3 rm
          "s3://$PIPELINE_STAGE_BUCKET/$PIPELINE_STAGE_PREFIX/"
          --recursive
          --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          --region auto
