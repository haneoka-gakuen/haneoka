name: Publish reviewed current catalog projection
on:
  workflow_dispatch:
    inputs:
      resource:
        description: Existing catalog resource to recompile from the reviewed current pin
        type: choice
        options: [bands, missions, runtime]
        default: bands
        required: true
      producer_pin:
        description: Full reviewed commit containing the bounded projection publisher
        required: true
        type: string
      projection_json:
        description: Native projection evidence for Intl and JP under exact current pins
        required: true
        type: string
      publish:
        description: Promote after bounded unchanged-parent and exact selected projection checks
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: current-catalog-projection
  cancel-in-progress: false
jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.resource == 'runtime' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(inputs.resource == 'runtime' && '["intl"]' || '["intl","jp"]') }}
    environment: resource-${{ matrix.server }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.producer_pin }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the existing small R2/compiler import closure
        env:
          CATALOG_PROJECTION_RESOURCE: ${{ inputs.resource }}
        run: |
          extra=()
          if [ "$CATALOG_PROJECTION_RESOURCE" = runtime ]; then
            extra=(--bootstrap-package numpy --bootstrap-package pillow)
          fi
          python scripts/publish/reference_postpin.py --bootstrap "$RUNNER_TEMP/band-dependencies" "${extra[@]}"
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/band-dependencies/requirements.txt"
      - name: Prepare the selected projection and optionally switch current atomically
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PRODUCER_PIN: ${{ inputs.producer_pin }}
          RESOURCE_SERVER: ${{ matrix.server }}
          BAND_DESCRIPTION_PROJECTION_JSON: ${{ inputs.projection_json }}
          CATALOG_PROJECTION_JSON: ${{ inputs.projection_json }}
          CATALOG_PROJECTION_RESOURCE: ${{ inputs.resource }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          case "$CATALOG_PROJECTION_RESOURCE" in
            bands) python scripts/publish/band_descriptions.py --output "$RUNNER_TEMP/band-output" ;;
            missions) python scripts/publish/missions.py --output "$RUNNER_TEMP/band-output" ;;
            runtime) python scripts/publish/runtime_projection.py --output "$RUNNER_TEMP/band-output" ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: band-description-${{ matrix.server }}-${{ github.run_id }}
          path: ${{ runner.temp }}/band-output/*.json
          if-no-files-found: ignore
          retention-days: 7

  refresh-static-pages:
    needs: bands
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Rebuild the public snapshot after both current projections are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
