name: Publish current native band introductions
on:
  workflow_dispatch:
    inputs:
      producer_pin:
        description: Full reviewed commit containing the bounded projection publisher
        required: true
        type: string
      projection_json:
        description: Native five-band description evidence for Intl and JP under exact current pins
        required: true
        type: string
      publish:
        description: Promote after bounded unchanged-parent and exact band projection checks
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: current-band-description-projection
  cancel-in-progress: false
jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [intl, jp]
    environment: resource-${{ matrix.server }}
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.producer_pin }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the existing small R2/compiler import closure
        run: |
          python scripts/publish/reference_postpin.py --bootstrap "$RUNNER_TEMP/band-dependencies"
          python -m pip install --disable-pip-version-check --require-hashes \
            --requirement "$RUNNER_TEMP/band-dependencies/requirements.txt"
      - name: Prepare only five descriptions and optionally switch current atomically
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          PRODUCER_PIN: ${{ inputs.producer_pin }}
          RESOURCE_SERVER: ${{ matrix.server }}
          BAND_DESCRIPTION_PROJECTION_JSON: ${{ inputs.projection_json }}
          PUBLISH: ${{ inputs.publish }}
        run: python scripts/publish/band_descriptions.py --output "$RUNNER_TEMP/band-output"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: band-description-${{ matrix.server }}-${{ github.run_id }}
          path: ${{ runner.temp }}/band-output/*.json
          if-no-files-found: ignore
          retention-days: 7
