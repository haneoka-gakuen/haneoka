name: Publish story offline manifests
on:
  workflow_call:
    inputs:
      server:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      server:
        type: choice
        options: [all, jp, intl]
        default: all
  schedule:
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: read
jobs:
  publish:
    strategy:
      max-parallel: 1
      matrix:
        server: [jp, intl]
    if: inputs.server == 'all' || inputs.server == '' || inputs.server == 'jp' || inputs.server == 'intl'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: resource-${{ matrix.server }}
    concurrency:
      group: story-offline-${{ matrix.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked R2 dependencies
        run: python -m pip install --require-hashes -r scripts/requirements-static-storage.txt
      - name: Publish complete story dependency graph
        if: inputs.server == matrix.server || inputs.server == 'all' || inputs.server == ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: python scripts/publish/story_offline.py --server '${{ matrix.server }}'
