name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: Apply production D1 migrations with explicit authorization
        type: boolean
        default: false

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify

      - name: Provision licensed Cubism runtime
        uses: ./.github/actions/setup-cubism-runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Reuse immutable release catalog reads
        uses: actions/cache@v6
        with:
          path: data/static-catalog/v1
          key: static-catalog-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: static-catalog-v1-${{ runner.os }}-

      - name: Reuse verified immutable embed compatibility files
        uses: actions/cache@v6
        with:
          path: public/embed
          key: embed-compat-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: embed-compat-v1-${{ runner.os }}-

      - name: Build production assets before database changes
        run: |
          pnpm build:packages
          pnpm --filter @haneoka/api-client build
          pnpm --filter @haneoka/embed-core build
          pnpm build:frontend
          pnpm runtime:cubism:verify-output
          for entry in core vega cassiopeia home-spot vega-theme api-client; do
            test -s ".output/public/embed/${entry}.js"
          done
          test -s .output/public/embed/manifest.json
        env:
          STATIC_RESOURCE_SERVERS: intl,jp
          STATIC_CATALOG_SOURCE: http

      - name: Check resource pipeline
        run: |
          python3 -m unittest discover -s scripts/garupa_master/tests -t .

      - name: Apply production D1 migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_d1_migrations == true }}
        run: pnpm exec wrangler d1 migrations apply haneoka-community --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          for deploy_attempt in 1 2 3; do
            echo "Wrangler deployment attempt $deploy_attempt/3"
            if pnpm exec wrangler deploy; then
              exit 0
            else
              deploy_status=$?
            fi
            if [ "$deploy_attempt" -eq 3 ]; then
              echo "Wrangler deployment failed after 3 attempts (exit $deploy_status)"
              exit "$deploy_status"
            fi
            deploy_backoff=$((deploy_attempt * 5))
            echo "Wrangler exited $deploy_status; retrying deployment in ${deploy_backoff}s using this run's built output/cache"
            sleep "$deploy_backoff"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
