name: Deploy to Cloudflare Workers
on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!scripts/**/*.py"
      - scripts/build/icon_sprite.py
      - "!scripts/requirements.txt"
      - "!.github/workflows/resource-*.yml"
      - "!.github/actions/setup-resource-pipeline/**"
      - "!.github/workflows/home-spot-repair.yml"
      - "!scripts/deploy/worker-publication.mjs"
      - "!scripts/deploy/publication-source.mjs"
      - "!packages/sonolus/scripts/**"
      - "!.dependencies/sonolus-our-notes"
      - "!.github/workflows/deploy-cloudflare.yml"
      - "!**/L1.md"
      - "!**/L2.md"
      - "!**/L2-2.md"
      - "!docs/geb-scope.json"
      - "public/**"
  workflow_dispatch:
    inputs:
      apply_d1_migrations:
        description: Apply pending production D1 migrations on this manual run
        type: boolean
        default: true
      worker_only:
        description: Publish only the Worker, database and cron using the current verified static assets
        type: boolean
        default: false
      build_containers:
        description: Rebuild sealed container inputs with worker_only while retaining verified static assets
        type: boolean
        default: false
      frontend_run_id:
        description: Promote the complete frontend from this verified run with the current worker_only source
        type: string
        default: ""
      publication_run_id:
        description: Reuse a sealed complete publication from this completed deployment run
        type: string
        default: ""
jobs:
  recovery:
    name: Resolve sealed publication
    if: ${{ inputs.publication_run_id != '' || inputs.frontend_run_id != '' || (inputs.build_containers && !inputs.worker_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.artifact.outputs.source_sha }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      artifact_run_id: ${{ steps.artifact.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve verified complete publication
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
          WORKER_ONLY: ${{ inputs.worker_only }}
          BUILD_CONTAINERS: ${{ inputs.build_containers }}
        run: |
          [[ "$BUILD_CONTAINERS" != "true" || "$WORKER_ONLY" == "true" ]] || { echo "Container rebuild requires worker_only" >&2; exit 1; }
          [[ -z "$PUBLICATION_RUN_ID" || -z "$FRONTEND_RUN_ID" ]] || { echo "Select one publication source" >&2; exit 1; }
          if [[ -n "$FRONTEND_RUN_ID" ]]; then
            [[ "$WORKER_ONLY" == "true" ]] || { echo "Frontend promotion requires worker_only" >&2; exit 1; }
            node scripts/deploy/publication-source.mjs resolve --run-id "$FRONTEND_RUN_ID"
          else
            [[ "$WORKER_ONLY" != "true" ]] || { echo "Select a complete publication without worker_only" >&2; exit 1; }
            node scripts/deploy/publication-source.mjs resolve --run-id "$PUBLICATION_RUN_ID"
          fi
  frontend:
    name: Build verified complete frontend
    if: ${{ !inputs.worker_only && !inputs.build_containers && inputs.publication_run_id == '' && inputs.frontend_run_id == '' }}
    uses: ./.github/workflows/static-frontend.yml
    permissions:
      contents: read
    secrets: inherit
  build:
    name: Build verified service artifact
    needs: recovery
    if: ${{ always() && !cancelled() && inputs.worker_only && inputs.publication_run_id == '' && (inputs.frontend_run_id == '' || needs.recovery.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      STATIC_PAGE_GROUPS: core
      STATIC_RESOURCE_SERVERS: intl,jp
      STATIC_CATALOG_SOURCE: http
      PROVIDER_STATIC_SNAPSHOT: data/provider-static/snapshots/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules
      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout
      - name: Set up the locked Vega Rust and WASM toolchain
        uses: ./.dependencies/vega/.github/actions/setup-wasm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify
      - name: Provision licensed Cubism runtime
        uses: ./.github/actions/setup-cubism-runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
      - name: Build shared engine and application packages
        run: pnpm build:packages
      - name: Check resource pipeline
        run: |
          python3 -m unittest discover -s scripts/garupa_master/tests -t .
      - name: Check Worker types
        run: pnpm typecheck:worker
      - name: Check out selected frontend source
        if: ${{ inputs.frontend_run_id != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.recovery.outputs.source_sha }}
          path: .output/frontend-source
          fetch-depth: 0
      - name: Check out selected frontend external locks
        if: ${{ inputs.frontend_run_id != '' }}
        working-directory: .output/frontend-source
        run: node scripts/external-repositories.mjs checkout
      - name: Restore selected complete frontend artifact
        if: ${{ inputs.frontend_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.recovery.outputs.artifact_name }}
          run-id: ${{ needs.recovery.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: .output/frontend-artifact
      - name: Extract selected complete frontend publication
        if: ${{ inputs.frontend_run_id != '' }}
        run: |
          if [[ -f .output/frontend-artifact/worker-publication.tar.zst ]]; then
            tar --zstd -xf .output/frontend-artifact/worker-publication.tar.zst -C .output/frontend-source
          else
            tar -xf .output/frontend-artifact/worker-publication.tar -C .output/frontend-source
          fi
      - name: Prepare verified Worker publication
        shell: bash
        run: |
          args=(prepare --worker-only)
          if [[ "$BUILD_CONTAINERS" == "true" ]]; then args+=(--build-containers); fi
          if [[ -n "$HANEOKA_FRONTEND_ARTIFACT_RUN_ID" ]]; then args+=(--frontend-source .output/frontend-source); fi
          node scripts/deploy/worker-publication.mjs "${args[@]}"
        env:
          BUILD_CONTAINERS: ${{ inputs.build_containers }}
          HANEOKA_FRONTEND_ARTIFACT_RUN_ID: ${{ inputs.frontend_run_id }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Archive verified publication
        shell: bash
        env:
          FRONTEND_RUN_ID: ${{ inputs.frontend_run_id }}
        run: |
          files=(.output/deployment)
          if [[ -n "$FRONTEND_RUN_ID" ]]; then files+=(.output/public .output/static-documents/publication.json .output/static-documents/references.json); fi
          tar --use-compress-program="zstd -T2 -3" -cf .output/worker-publication.tar.zst "${files[@]}"
      - name: Save verified publication artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-publication-${{ github.sha }}-${{ github.run_id }}
          path: .output/worker-publication.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  deploy:
    name: Publish verified production artifact
    needs: [frontend, build, recovery]
    if: ${{ always() && !cancelled() && ((inputs.publication_run_id != '' && needs.recovery.result == 'success') || (inputs.publication_run_id == '' && ((inputs.worker_only && needs.build.result == 'success') || (!inputs.worker_only && needs.frontend.result == 'success')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cloudflare-production-publish
      cancel-in-progress: false
    env:
      HANEOKA_PUBLICATION_ARTIFACT_RUN_ID: ${{ inputs.publication_run_id }}
      HANEOKA_FRONTEND_ARTIFACT_RUN_ID: ${{ inputs.frontend_run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.publication_run_id != '' && needs.recovery.outputs.source_sha || github.sha }}
      - name: Check out current publication tooling
        if: ${{ inputs.publication_run_id != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .output/publication-tooling
          sparse-checkout: |
            scripts/deploy/worker-publication.mjs
            scripts/deploy/publication-source.mjs
          sparse-checkout-cone-mode: false
      - name: Install pnpm
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules
      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify
      - name: Restore verified publication artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.publication_run_id != '' && needs.recovery.outputs.artifact_name || format('worker-publication-{0}-{1}', github.sha, github.run_id) }}
          run-id: ${{ inputs.publication_run_id != '' && needs.recovery.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: .output/restore
      - name: Restore publication files
        run: |-
          if [[ -f .output/restore/worker-publication.tar.zst ]]; then
            tar --zstd -xf .output/restore/worker-publication.tar.zst
          else
            tar -xf .output/restore/worker-publication.tar
          fi
          publisher=scripts/deploy/worker-publication.mjs
          if [[ -n "$HANEOKA_PUBLICATION_ARTIFACT_RUN_ID" ]]; then
            publisher=.output/publication-tooling/scripts/deploy/worker-publication.mjs
          fi
          node "$publisher" verify --source-root "$GITHUB_WORKSPACE"
      - name: Apply production D1 migrations
        if: ${{ github.event_name == 'push' || inputs.apply_d1_migrations == true }}
        run: |
          pnpm exec wrangler d1 migrations apply haneoka-community --remote
          pnpm exec wrangler d1 migrations apply haneoka-records --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish verified Worker and assets
        run: |
          publisher=scripts/deploy/worker-publication.mjs
          if [[ -n "$HANEOKA_PUBLICATION_ARTIFACT_RUN_ID" ]]; then
            publisher=.output/publication-tooling/scripts/deploy/worker-publication.mjs
          fi
          node "$publisher" publish --source-root "$GITHUB_WORKSPACE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          HANEOKA_PUBLICATION_LOCK: cloudflare-production-publish
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Save successful static deployment receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-deployment-${{ github.sha }}-${{ github.run_id }}
          path: |
            .output/deployment/successful-static-deployment.json
            .output/deployment/publication-context.json
          retention-days: 30
          if-no-files-found: ignore
concurrency:
  group: cloudflare-production-build-${{ inputs.publication_run_id != '' && 'recovery' || inputs.worker_only && 'worker' || 'frontend' }}
  cancel-in-progress: false
