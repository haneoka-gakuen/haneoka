name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify external repository compatibility lock
        run: pnpm dependencies:verify

      - name: Inject licensed Cubism runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          CUBISM_RUNTIME_BUCKET: hotdori-assets
          CUBISM_RUNTIME_KEY: private/cubism-runtime/haneoka-cubism-web-runtime-v1.tar.gz
        run: |
          set -euo pipefail

          runtime_archive="$RUNNER_TEMP/haneoka-cubism-runtime.tar.gz"
          runtime_directory="$RUNNER_TEMP/haneoka-cubism-runtime"
          aws s3 cp \
            "s3://$CUBISM_RUNTIME_BUCKET/$CUBISM_RUNTIME_KEY" \
            "$runtime_archive" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

          extract_runtime_file() {
            local relative_path="$1"
            local destination="$runtime_directory/$relative_path"
            mkdir -p "$(dirname "$destination")"
            tar --extract --gzip --to-stdout \
              --file "$runtime_archive" \
              "$relative_path" > "$destination"
          }

          extract_runtime_file "Framework/vega-cubism-web-runtime.mjs"
          extract_runtime_file "Framework/LICENSE.md"
          extract_runtime_file "Core/live2dcubismcore.js"
          extract_runtime_file "Core/live2d.min.js"
          extract_runtime_file "Core/CRI/live2dcubismmotionsynccore.min.js"
          extract_runtime_file "Core/CRI/live2dcubismmotionsynccore.d.ts"
          extract_runtime_file "Core/CRI/LICENSE.md"
          extract_runtime_file "Core/CRI/RedistributableFiles.txt"
          echo "HANEOKA_CUBISM_RUNTIME_DIR=$runtime_directory" >> "$GITHUB_ENV"

      - name: Verify licensed Cubism runtime
        run: pnpm runtime:cubism:provision

      - name: Build production assets before database changes
        run: pnpm build

      - name: Check resource pipeline
        run: python3 -m unittest discover -s scripts/garupa_master/tests -t .

      - name: Apply production D1 migrations
        run: pnpm exec wrangler d1 migrations apply haneoka-community --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
