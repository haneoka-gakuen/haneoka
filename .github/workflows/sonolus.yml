name: Sonolus engine payload

# The Sonolus engine + presentation payload is server-agnostic, so it is built
# and published independently of the resource pipeline. Charts stay per-release
# and are projected dynamically, so this workflow only rebuilds when the engine
# or its build inputs change. A manual dispatch republishes after a game update
# refreshes the note-se / NoteEffect presentation assets.
#
# The four engine facets (play/watch/preview/tutorial) compile on separate
# runners in the `engine` matrix job, then the `payload` fan-in merges them and
# publishes. Each facet is cached independently, so editing one facet only
# recompiles that one.
on:
  push:
    branches: [main]
    paths:
      - packages/sonolus/engine/**
      - packages/sonolus/src/**
      - packages/sonolus/scripts/**
      - packages/sonolus/assets/**
      - scripts/pipeline.py
      - scripts/publish/sonolus.py
      - scripts/publish/r2.py
      - .github/workflows/sonolus.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sonolus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Compile ${{ matrix.facet }} facet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        facet: [play, watch, preview, tutorial]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        # Must precede setup-node so its `cache: pnpm` can resolve the store path.
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore compiled ${{ matrix.facet }} facet
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: packages/sonolus/engine/.build-matrix/${{ matrix.facet }}/dist
          # Exact-key match only (no restore-keys): a stale output must never ship.
          key: sonolus-engine-${{ matrix.facet }}-v1-${{ runner.os }}-node24-${{ hashFiles(format('packages/sonolus/engine/{0}/**', matrix.facet), 'packages/sonolus/engine/shared/**', 'packages/sonolus/engine/esbuild.config.ts', 'packages/sonolus/engine/tsconfig.base.json', 'pnpm-lock.yaml') }}

      - name: Compile ${{ matrix.facet }} facet
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: node packages/sonolus/engine/scripts/build.ts ${{ matrix.facet }}

      - name: Save compiled ${{ matrix.facet }} facet
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/sonolus/engine/.build-matrix/${{ matrix.facet }}/dist
          key: sonolus-engine-${{ matrix.facet }}-v1-${{ runner.os }}-node24-${{ hashFiles(format('packages/sonolus/engine/{0}/**', matrix.facet), 'packages/sonolus/engine/shared/**', 'packages/sonolus/engine/esbuild.config.ts', 'packages/sonolus/engine/tsconfig.base.json', 'pnpm-lock.yaml') }}

      - name: Upload ${{ matrix.facet }} facet artifact
        # Always uploaded, even on a cache hit (re-uploaded from the restored
        # path), so the fan-in job has every facet.
        uses: actions/upload-artifact@v7
        with:
          name: engine-facet-${{ matrix.facet }}
          path: packages/sonolus/engine/.build-matrix/${{ matrix.facet }}/dist
          if-no-files-found: error
          retention-days: 1

  payload:
    name: Assemble and publish the global payload
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      R2_BUCKET: hotdori-assets

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.in

      - name: Install the R2 client and pipeline dependencies
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements.in

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Typecheck engine tooling
        # Runs once here (was bundled into the per-machine build before).
        run: pnpm --dir packages/sonolus/engine run typecheck:tools

      - name: Download compiled facets
        # Each artifact contributes EngineConfiguration (byte-identical across
        # facets, so the merge overwrite is safe) plus one Engine<Facet>Data.
        uses: actions/download-artifact@v8
        with:
          pattern: engine-facet-*
          path: packages/sonolus/engine/dist
          merge-multiple: true

      - name: Stamp engine distribution with licenses
        run: node packages/sonolus/engine/scripts/copy-upstream-license.ts

      - name: Fetch release presentation assets
        # Materialize only the runtime slices the build reads (note-se audio,
        # NoteEffect definitions, the lane mask) from the current jp-cbt release.
        run: |
          python scripts/pipeline.py --server jp-cbt fetch-sonolus-inputs \
            --output "$RUNNER_TEMP/sonolus-release"

      - name: Build the global Sonolus payload
        run: pnpm sonolus:payload
        env:
          RESOURCE_BUILD_ROOT: ${{ runner.temp }}/sonolus-release

      - name: Publish the payload to R2
        run: python scripts/publish/sonolus.py
