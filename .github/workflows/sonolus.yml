name: Sonolus engine payload

# The Sonolus engine + presentation payload is server-agnostic, so it is built
# and published independently of the resource pipeline. Charts stay per-release
# and are projected dynamically, so this workflow only rebuilds when the engine
# or its build inputs change. A manual dispatch republishes after a game update
# refreshes the note-se / NoteEffect presentation assets.
#
# The four engine facets (play/watch/preview/tutorial) compile on separate
# runners in the `engine` matrix job, then the `payload` fan-in merges them and
# publishes. Each facet is cached independently, so editing one facet only
# recompiles that one.
on:
  push:
    branches: [main]
    paths:
      - .gitmodules
      - .dependencies/cassiopeia-plugin-sonolus
      - .dependencies/sonolus-our-notes
      - .dependencies/cassiopeia-plugin-our-notes
      - .dependencies/cassiopeia-renderer-three
      - .dependencies/cassiopeia
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/sonolus/**
      - scripts/pipeline.py
      - scripts/publish/sonolus.py
      - scripts/publish/r2.py
      - scripts/requirements.txt
      - .github/workflows/sonolus.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sonolus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Compile ${{ matrix.facet }} facet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - facet: play
            optimization: high
          - facet: watch
            optimization: high
          - facet: preview
            optimization: high
          - facet: tutorial
            optimization: high
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        # Must precede setup-node so its `cache: pnpm` can resolve the store path.
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install engine dependencies
        run: pnpm --dir .dependencies/sonolus-our-notes install --frozen-lockfile

      - name: Identify facet inputs
        id: facet-key
        run: echo "key=$(node .dependencies/sonolus-our-notes/scripts/build-cache-key.ts '${{ matrix.facet }}' '${{ matrix.optimization }}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiled ${{ matrix.facet }} facet
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependencies/sonolus-our-notes/.build-matrix/${{ matrix.facet }}/dist
          # Exact-key match only (no restore-keys): a stale output must never ship.
          key: sonolus-facet-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.facet-key.outputs.key }}

      - name: Compile ${{ matrix.facet }} facet
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: node .dependencies/sonolus-our-notes/scripts/build.ts ${{ matrix.facet }}
        env:
          SONOLUS_COMPILER_OPTIMIZATION_LEVEL: ${{ matrix.optimization }}
          SONOLUS_COMPILER_WORKERS: 1

      - name: Save compiled ${{ matrix.facet }} facet
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dependencies/sonolus-our-notes/.build-matrix/${{ matrix.facet }}/dist
          key: sonolus-facet-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.facet-key.outputs.key }}

      - name: Upload ${{ matrix.facet }} facet artifact
        # Always uploaded, even on a cache hit (re-uploaded from the restored
        # path), so the fan-in job has every facet.
        uses: actions/upload-artifact@v7
        with:
          name: engine-facet-${{ matrix.facet }}
          path: .dependencies/sonolus-our-notes/.build-matrix/${{ matrix.facet }}/dist
          if-no-files-found: error
          retention-days: 1

  payload:
    name: Assemble and publish the global payload
    environment: resource-intl
    needs: engine
    runs-on: ubuntu-latest
    env:
      RESOURCE_PIPELINE_CONFIG: ${{ secrets.RESOURCE_PIPELINE_CONFIG }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONPATH: scripts
      R2_BUCKET: hotdori-assets
      RELEASE_SERVER: intl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .gitmodules

      - name: Check out locked external repositories
        run: node scripts/external-repositories.mjs checkout

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sonolus converter dependencies
        run: |
          pnpm --filter @haneoka/cassiopeia build:web
          pnpm --filter @haneoka/cassiopeia-plugin-our-notes build
          pnpm --filter @haneoka/cassiopeia-renderer-three build
          pnpm --filter @haneoka/cassiopeia-plugin-sonolus build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install the R2 client and pipeline dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --requirement scripts/requirements.txt

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          apt_options=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if ! sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
            fi
          fi
          ffmpeg -version

      - name: Typecheck engine tooling
        # Runs once here (was bundled into the per-machine build before).
        run: pnpm --dir .dependencies/sonolus-our-notes run typecheck:tools

      - name: Download compiled facets
        # Each artifact contributes byte-identical EngineConfiguration/EngineRom
        # plus one Engine<Facet>Data.
        uses: actions/download-artifact@v8
        with:
          pattern: engine-facet-*
          path: .dependencies/sonolus-our-notes/dist
          merge-multiple: true

      - name: Stamp engine distribution with licenses
        run: node .dependencies/sonolus-our-notes/scripts/copy-upstream-license.ts

      - name: Fetch release presentation assets
        # Materialize only the runtime slices the build reads (note-se audio,
        # NoteEffect definitions, the lane mask) from the current Intl release.
        run: |
          python scripts/pipeline.py --server intl fetch-sonolus-inputs \
            --output "$RUNNER_TEMP/sonolus-release"

      - name: Identify particle content inputs
        id: particle-key
        run: |
          key="$(node packages/sonolus/scripts/build-original-assets.ts --particle-cache-key | tail -n 1)"
          base_key="$(node packages/sonolus/scripts/build-original-assets.ts --particle-base-cache-key | tail -n 1)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "base-key=$base_key" >> "$GITHUB_OUTPUT"
        env:
          RESOURCE_BUILD_ROOT: ${{ runner.temp }}/sonolus-release

      - name: Restore native particle bake
        id: particle-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/sonolus-native-particles
          key: sonolus-particles-v2-${{ runner.os }}-${{ steps.particle-key.outputs.base-key }}-${{ steps.particle-key.outputs.key }}
          restore-keys: |
            sonolus-particles-v2-${{ runner.os }}-${{ steps.particle-key.outputs.base-key }}-
            sonolus-particles-v1-${{ runner.os }}-${{ steps.particle-key.outputs.base-key }}

      - name: Build the global Sonolus payload
        run: pnpm sonolus:payload
        env:
          RESOURCE_BUILD_ROOT: ${{ runner.temp }}/sonolus-release

      - name: Save verified native particle bake
        if: steps.particle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/sonolus-native-particles
          key: sonolus-particles-v2-${{ runner.os }}-${{ steps.particle-key.outputs.base-key }}-${{ steps.particle-key.outputs.key }}

      - name: Publish the payload to R2
        run: python scripts/publish/sonolus.py
