name: Collect unused static documents

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the verified unreachable-object plan
        type: boolean
        default: false
      resume_run_id:
        description: Reuse complete inventory checkpoints from a GC run within 24 hours
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloudflare-production-publish
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      HANEOKA_PUBLICATION_LOCK: cloudflare-production-publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-static-storage.txt
      - run: python -m pip install --require-hashes -r scripts/requirements-static-storage.txt
      - name: Download prior inventory checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        id: inventory
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: static-document-gc-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/static-gc-resume
      - name: Restore complete inventory shards
        if: ${{ steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          shopt -s nullglob
          checkpoints=("$RUNNER_TEMP/static-gc-resume"/static-gc-inventory-*.json)
          if (( ${#checkpoints[@]} )); then
            mkdir -p .output
            cp -- "${checkpoints[@]}" .output/
          fi
      - name: Mark active, rollback and recent publications
        run: >-
          python scripts/publish/static_documents.py collect
          --plan .output/static-gc-plan.json
          --report .output/static-gc-report.json
      - name: Apply the verified plan
        if: ${{ inputs.apply == true || (github.event_name == 'schedule' && vars.STATIC_DOCUMENT_GC_APPLY != 'false') }}
        run: >-
          python scripts/publish/static_documents.py apply
          --plan .output/static-gc-plan.json
          --report .output/static-gc-report.json
      - name: Save the plan and collection receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-document-gc-${{ github.run_id }}
          path: .output/static-gc-*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
