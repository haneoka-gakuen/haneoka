name: Publish Haneoka app downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/publish/app_downloads.py
      - scripts/publish/download_store.py
      - .github/workflows/app-downloads.yml
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: haneoka-app-downloads
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked R2 dependencies
        run: |
          python -m pip install --require-hashes -r scripts/requirements-static-storage.txt
      - name: Mirror verified stable release
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python scripts/publish/app_downloads.py --cloudflare-token --output "$RUNNER_TEMP/app-download-result.json"
          echo "changed=$(python -c 'import json,os;print(str(json.load(open(os.environ["RUNNER_TEMP"]+"/app-download-result.json"))["changed"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Refresh website download metadata
        if: steps.mirror.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
