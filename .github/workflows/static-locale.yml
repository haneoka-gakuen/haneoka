name: Render and index complete locale
on:
  workflow_call:
    secrets:
      CONTENT_BUILD_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
    inputs:
      locale:
        type: string
        required: true
      runtime_policy:
        type: string
        default: required
      inputs_artifact:
        type: string
        required: true
      inputs_sha:
        type: string
        required: true
      node_version:
        type: string
        required: true
      page_groups:
        type: string
        default: core
      resource_servers:
        type: string
        default: intl,jp
      verify_uploads:
        type: boolean
        default: false
      preupload:
        type: boolean
        default: false
env:
  STATIC_PUBLIC_DOCUMENTS: "1"
  STATIC_PUBLIC_MEDIA: "1"
  STATIC_PUBLIC_MEDIA_MAX_BYTES: "536870912"
jobs:
  render:
    name: Render ${{ inputs.locale }} partition ${{ matrix.partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      STATIC_PAGE_GROUPS: ${{ inputs.page_groups }}
      STATIC_RESOURCE_SERVERS: ${{ inputs.resource_servers }}
      STATIC_CATALOG_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CONTENT_BUILD_TOKEN || '' }}
      STATIC_CATALOG_SOURCE: http
      STATIC_BUILD_INPUT_MODE: frozen
      STATIC_BUILD_INPUT_ROOT: data/static-build/inputs
      STATIC_BUILD_LOCALE: ${{ inputs.locale }}
      STATIC_BUILD_PARTITION: ${{ matrix.partition }}/4
      ASTRO_TELEMETRY_DISABLED: "1"
      HANEOKA_CUBISM_RUNTIME_POLICY: ${{ inputs.runtime_policy }}
    steps:
      - name: Resolve immutable locale checkpoints
        id: checkpoint
        if: github.run_attempt > 1
        uses: actions/github-script@v8
        env:
          HANDOFF_GENERATION: ${{ inputs.inputs_sha }}
          HANDOFF_LOCALE: ${{ inputs.locale }}
          HANDOFF_PARTITION: ${{ matrix.partition }}
        with:
          retries: 0
          script: |
            const assert = require('node:assert/strict');
            const read = async (method, parameters) => {
              for (let attempt = 0; ; attempt++) {
                try { return await method({ ...parameters, request: { signal: AbortSignal.timeout(5000) } }); }
                catch (error) {
                  if (attempt === 2) throw error;
                  await new Promise(resolve => setTimeout(resolve, 250 * (attempt + 1)));
                }
              }
            };
            const parameters = { ...context.repo, run_id: context.runId };
            const { data: run } = await read(github.rest.actions.getWorkflowRun, parameters);
            const expectedHead = context.eventName === 'pull_request' ? context.payload.pull_request.head.sha : context.sha;
            assert.equal(run.head_sha, expectedHead);
            const artifacts = [];
            for (let page = 1; ; page++) {
              const { data } = await read(github.rest.actions.listWorkflowRunArtifacts, { ...parameters, per_page: 100, page });
              artifacts.push(...data.artifacts);
              if (data.artifacts.length < 100) break;
            }
            const find = name => {
              const matches = artifacts.filter(artifact => artifact.name === name);
              assert.ok(matches.length <= 1, `Duplicate immutable artifact: ${name}`);
              if (!matches.length) return '';
              const artifact = matches[0];
              assert.ok(!artifact.expired && artifact.size_in_bytes > 0);
              assert.match(artifact.digest || '', /^sha256:[a-f0-9]{64}$/);
              assert.equal(artifact.workflow_run?.id, context.runId);
              assert.equal(artifact.workflow_run?.repository_id, run.repository.id);
              assert.equal(artifact.workflow_run?.head_sha, run.head_sha);
              return String(artifact.id);
            };
            const stem = `${process.env.HANDOFF_GENERATION}-${process.env.HANDOFF_LOCALE}`;
            const complete = find(`static-part-${stem}`);
            core.setOutput('complete', complete);
            if (!complete) core.setOutput('render', find(`static-render-${stem}-${process.env.HANDOFF_PARTITION}`));
      - uses: actions/checkout@v7
        if: steps.checkpoint.outputs.complete == ''
        with:
          fetch-depth: 0
      - run: corepack enable
        if: steps.checkpoint.outputs.complete == ''
      - uses: actions/setup-node@v7
        if: steps.checkpoint.outputs.complete == ''
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: node scripts/external-repositories.mjs checkout
        if: steps.checkpoint.outputs.complete == ''
      - run: pnpm install --frozen-lockfile
        if: steps.checkpoint.outputs.complete == ''
      - uses: actions/download-artifact@v8
        if: steps.checkpoint.outputs.complete == ''
        with:
          name: ${{ inputs.inputs_artifact }}
          path: .output
      - name: Restore verified common artifacts and immutable inputs
        if: steps.checkpoint.outputs.complete == ''
        run: |
          node scripts/build/static-build-inputs.mjs restore --manifest .output/static-frozen-inputs/manifest.json --root "$PWD" --source-root "$PWD"
          pnpm dependencies:verify
      - name: Render and verify the assigned complete pages
        if: steps.checkpoint.outputs.complete == '' && steps.checkpoint.outputs.render == ''
        run: |
          pnpm exec astro build
          node scripts/build/finalize-frontend.mjs --materialize-only
          node scripts/build/static-build-shards.mjs seal-render --root "$PWD" --locale "$STATIC_BUILD_LOCALE" --partition "$STATIC_BUILD_PARTITION" --plan .output/static-shard-plan.json --inputs .output/static-frozen-inputs/manifest.json --output .output/static-render-part
          tar --use-compress-program="zstd -T2 -3" -cf .output/static-render-part.tar.zst -C .output/static-render-part .
      - uses: actions/upload-artifact@v7
        if: steps.checkpoint.outputs.complete == '' && steps.checkpoint.outputs.render == ''
        with:
          name: static-render-${{ inputs.inputs_sha }}-${{ inputs.locale }}-${{ matrix.partition }}
          path: .output/static-render-part.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          overwrite: false
          if-no-files-found: error
      - name: Check for an immediate finalizer handoff
        id: handoff
        if: steps.checkpoint.outputs.complete == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_GENERATION: ${{ inputs.inputs_sha }}
          HANDOFF_LOCALE: ${{ inputs.locale }}
          HANDOFF_PARTITION: ${{ matrix.partition }}
        run: node scripts/build/static-render-handoff.mjs candidate --locale "$HANDOFF_LOCALE" --generation "$HANDOFF_GENERATION" --partition "$HANDOFF_PARTITION"
      - name: Claim finalization on this prepared runner
        id: claim
        if: steps.handoff.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: static-finalizer-claim-${{ inputs.inputs_sha }}-${{ inputs.locale }}
          path: ${{ steps.handoff.outputs.claim_file }}
          compression-level: 0
          retention-days: 1
          overwrite: false
          if-no-files-found: error
      - name: Finalize on the prepared render runner
        if: steps.claim.outcome == 'success' && steps.claim.outputs['artifact-id'] != ''
        continue-on-error: true
        uses: ./.github/actions/finalize-static-locale
        with:
          prepared: "true"
          own_partition: ${{ matrix.partition }}
          locale: ${{ inputs.locale }}
          inputs_artifact: ${{ inputs.inputs_artifact }}
          inputs_sha: ${{ inputs.inputs_sha }}
          node_version: ${{ inputs.node_version }}
          preupload: ${{ inputs.preupload }}
          verify_uploads: ${{ inputs.verify_uploads }}
          github_token: ${{ github.token }}
          cloudflare_account_id: ${{ inputs.preupload && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          cloudflare_api_token: ${{ inputs.preupload && secrets.CLOUDFLARE_API_TOKEN || '' }}
  finalize:
    name: Render complete ${{ inputs.locale }} frontend
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      STATIC_PAGE_GROUPS: ${{ inputs.page_groups }}
      STATIC_RESOURCE_SERVERS: ${{ inputs.resource_servers }}
      STATIC_CATALOG_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CONTENT_BUILD_TOKEN || '' }}
      STATIC_CATALOG_SOURCE: http
      STATIC_BUILD_INPUT_MODE: frozen
      STATIC_BUILD_INPUT_ROOT: data/static-build/inputs
      STATIC_BUILD_LOCALE: ${{ inputs.locale }}
      ASTRO_TELEMETRY_DISABLED: "1"
      HANEOKA_CUBISM_RUNTIME_POLICY: ${{ inputs.runtime_policy }}
    steps:
      - name: Check for a complete locale before starting a runner setup
        id: checkpoint
        uses: actions/github-script@v8
        env:
          HANDOFF_GENERATION: ${{ inputs.inputs_sha }}
          HANDOFF_LOCALE: ${{ inputs.locale }}
        with:
          retries: 0
          script: |
            const assert = require('node:assert/strict');
            const read = async (method, parameters) => {
              for (let attempt = 0; ; attempt++) {
                try { return await method({ ...parameters, request: { signal: AbortSignal.timeout(5000) } }); }
                catch (error) {
                  if (attempt === 2) throw error;
                  await new Promise(resolve => setTimeout(resolve, 250 * (attempt + 1)));
                }
              }
            };
            const parameters = { ...context.repo, run_id: context.runId };
            const { data: run } = await read(github.rest.actions.getWorkflowRun, parameters);
            assert.equal(run.head_sha, context.eventName === 'pull_request' ? context.payload.pull_request.head.sha : context.sha);
            const artifacts = [];
            for (let page = 1; ; page++) {
              const { data } = await read(github.rest.actions.listWorkflowRunArtifacts, { ...parameters, per_page: 100, page });
              artifacts.push(...data.artifacts);
              if (data.artifacts.length < 100) break;
            }
            const matches = artifacts.filter(artifact => artifact.name === `static-part-${process.env.HANDOFF_GENERATION}-${process.env.HANDOFF_LOCALE}`);
            assert.ok(matches.length <= 1, 'Duplicate complete locale artifact');
            if (matches.length) {
              const artifact = matches[0];
              assert.ok(!artifact.expired && artifact.size_in_bytes > 0);
              assert.match(artifact.digest || '', /^sha256:[a-f0-9]{64}$/);
              assert.equal(artifact.workflow_run?.id, context.runId);
              assert.equal(artifact.workflow_run?.repository_id, run.repository.id);
              assert.equal(artifact.workflow_run?.head_sha, run.head_sha);
            }
            core.setOutput('complete', matches.length ? 'true' : 'false');
      - uses: actions/checkout@v7
        if: steps.checkpoint.outputs.complete != 'true'
        with:
          fetch-depth: 0
      - name: Finalize on the fallback runner
        if: steps.checkpoint.outputs.complete != 'true'
        uses: ./.github/actions/finalize-static-locale
        with:
          locale: ${{ inputs.locale }}
          inputs_artifact: ${{ inputs.inputs_artifact }}
          inputs_sha: ${{ inputs.inputs_sha }}
          node_version: ${{ inputs.node_version }}
          preupload: ${{ inputs.preupload }}
          verify_uploads: ${{ inputs.verify_uploads }}
          github_token: ${{ github.token }}
          cloudflare_account_id: ${{ inputs.preupload && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          cloudflare_api_token: ${{ inputs.preupload && secrets.CLOUDFLARE_API_TOKEN || '' }}
