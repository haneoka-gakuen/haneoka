name: Set up Sonolus engine
description: Restore the compiled engine or build it in the current job.

inputs:
  dependencies-installed:
    description: Use Node.js and workspace dependencies already installed by the caller.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore compiled engine
      id: engine-cache
      uses: actions/cache/restore@v6
      with:
        path: packages/sonolus/engine/dist
        key: sonolus-engine-v1-${{ runner.os }}-node24-${{ hashFiles('packages/sonolus/engine/**', 'LICENSE') }}

    - name: Set up Node.js
      if: steps.engine-cache.outputs.cache-hit != 'true' && inputs.dependencies-installed != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install engine dependencies
      if: steps.engine-cache.outputs.cache-hit != 'true' && inputs.dependencies-installed != 'true'
      shell: bash
      run: |
        corepack enable
        pnpm install --frozen-lockfile

    - name: Build Sonolus engine
      if: steps.engine-cache.outputs.cache-hit != 'true'
      shell: bash
      # `pnpm run build` typechecks, builds the play/watch/preview/tutorial facets
      # in parallel, and stamps dist/ with licenses + the source pointer.
      run: pnpm --dir packages/sonolus/engine run build

    - name: Save compiled engine
      if: steps.engine-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: packages/sonolus/engine/dist
        key: sonolus-engine-v1-${{ runner.os }}-node24-${{ hashFiles('packages/sonolus/engine/**', 'LICENSE') }}
