name: Set up resource pipeline
description: Install Python and cached pipeline dependencies.

runs:
  using: composite
  steps:
    - name: Validate and mask private pipeline configuration
      shell: bash
      env:
        PYTHONPATH: scripts
      run: python -m core.config --server "$RESOURCE_SERVER" --mask-github
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: scripts/requirements.txt
    - name: Install pipeline dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check --require-hashes --requirement scripts/requirements.txt
