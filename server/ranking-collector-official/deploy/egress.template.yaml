mixed-port: 7899
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: warning
ipv6: false
proxy-providers:
  subscription:
    type: http
    url: "SUBSCRIPTION_URL"
    path: ./providers/sub.yaml
    interval: 86400
    filter: "JP-"
    exclude-filter: "v6"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: JP
    type: fallback
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 300
rules:
  - MATCH,JP
